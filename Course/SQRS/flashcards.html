path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Give one web-banking threat per STRIDE category with a target and mitigation.<\/p>\n", "answer_html": "<p>Example set:<\/p>\n<ul>\n<li><strong>S<\/strong>poofing: stolen session impersonates user → MFA/session binding.<\/li>\n<li><strong>T<\/strong>ampering: modify request/account data → integrity checks + authorization.<\/li>\n<li><strong>R<\/strong>epudiation: admin denies transfer → tamper-evident audit log.<\/li>\n<li><strong>I<\/strong>nformation disclosure: session/account data leak → encryption + access control.<\/li>\n<li><strong>D<\/strong>oS: flood Auth Service → rate limits/circuit breakers/capacity controls.<\/li>\n<li><strong>E<\/strong>levation: normal user reaches Admin Panel → deny-by-default RBAC.\nSTRIDE recall is incomplete; add insider, side-channel, and supply-chain analysis.<\/li>\n<\/ul>\n"}, {"id": "l10-security-006", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q6 — Threat-model method for GDPR healthcare", "prompt": "Why is STRIDE alone insufficient, and what pragmatic mix should a small startup use?", "answer": "STRIDE focuses technical security properties; GDPR also demands privacy threats such as **linkability, identifiability, detectability, disclosure, unawareness, non-compliance** (LINDDUN). A small team can build one DFD, run STRIDE on trust boundaries, then a focused LINDDUN pass on personal/health data and data lifecycle. Start at lightweight repeatable maturity (trained facilitator + checklist) and evolve toward threat models in design reviews and release cadence.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Why is STRIDE alone insufficient, and what pragmatic mix should a small startup use?<\/p>\n", "answer_html": "<p>STRIDE focuses technical security properties; GDPR also demands privacy threats such as <strong>linkability, identifiability, detectability, disclosure, unawareness, non-compliance<\/strong> (LINDDUN). A small team can build one DFD, run STRIDE on trust boundaries, then a focused LINDDUN pass on personal/health data and data lifecycle. Start at lightweight repeatable maturity (trained facilitator + checklist) and evolve toward threat models in design reviews and release cadence.<\/p>\n"}, {"id": "l10-security-007", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q7 — Saltzer–Schroeder principles and breaches", "prompt": "Map major breaches to design principles; explain two in depth.", "answer": "Mappings are not unique—justify causally. Reasonable examples: **Target → least privilege / separation of privilege** (vendor access should not reach payment network); **Equifax → complete mediation / secure maintenance** (vulnerable internet-facing component remained exploitable); **Heartbleed → fail-safe defaults/economy of mechanism** (unchecked length exposed memory); **SolarWinds → least common mechanism / trusted build-chain controls**; **WannaCry → least privilege + fail-safe network segmentation**; **Log4Shell → economy of mechanism / minimize ambient dangerous capability**. State the principle definition and how design would reduce blast radius.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Map major breaches to design principles; explain two in depth.<\/p>\n", "answer_html": "<p>Mappings are not unique—justify causally. Reasonable examples: <strong>Target → least privilege / separation of privilege<\/strong> (vendor access should not reach payment network); <strong>Equifax → complete mediation / secure maintenance<\/strong> (vulnerable internet-facing component remained exploitable); <strong>Heartbleed → fail-safe defaults/economy of mechanism<\/strong> (unchecked length exposed memory); <strong>SolarWinds → least common mechanism / trusted build-chain controls<\/strong>; <strong>WannaCry → least privilege + fail-safe network segmentation<\/strong>; <strong>Log4Shell → economy of mechanism / minimize ambient dangerous capability<\/strong>. State the principle definition and how design would reduce blast radius.<\/p>\n"}, {"id": "l10-security-008", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q8 — Allowlist input validation", "prompt": "Design validation for name/email/age; show why denylisting fails and explain an input chokepoint.", "answer": "Allowlist by **type, canonical form, length, character set, and semantic range**: e.g. name normalized Unicode + bounded length; email parsed/canonicalized with bounded lengths; age integer within business range. Denylists miss encodings/Unicode/alternate syntax. **Canonicalize then validate**. An input chokepoint centralizes validation at a small trusted boundary so every downstream path receives normalized validated data and policy is not duplicated.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Design validation for name/email/age; show why denylisting fails and explain an input chokepoint.<\/p>\n", "answer_html": "<p>Allowlist by <strong>type, canonical form, length, character set, and semantic range<\/strong>: e.g. name normalized Unicode + bounded length; email parsed/canonicalized with bounded lengths; age integer within business range. Denylists miss encodings/Unicode/alternate syntax. <strong>Canonicalize then validate<\/strong>. An input chokepoint centralizes validation at a small trusted boundary so every downstream path receives normalized validated data and policy is not duplicated.<\/p>\n"}, {"id": "l10-security-009", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q9 — DevSecOps pipeline", "prompt": "Place security checks from IDE to production within time budgets.", "answer": "Example: IDE—lint/secret/SAST hints; pre-commit—secrets, formatting, fast SAST; CI build—SCA/SBOM, SAST, IaC/container scan; CI test—security unit/integration + fuzz subsets; staging/CD—DAST and policy/admission checks (long DAST async if ~14 min); production—runtime detection, WAF, dependency/vuln monitoring. Triage by severity/exploitability/ownership and baseline known false positives. Not all checks shift left because some require a running integrated system/real environment.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Place security checks from IDE to production within time budgets.<\/p>\n", "answer_html": "<p>Example: IDE—lint/secret/SAST hints; pre-commit—secrets, formatting, fast SAST; CI build—SCA/SBOM, SAST, IaC/container scan; CI test—security unit/integration + fuzz subsets; staging/CD—DAST and policy/admission checks (long DAST async if ~14 min); production—runtime detection, WAF, dependency/vuln monitoring. Triage by severity/exploitability/ownership and baseline known false positives. Not all checks shift left because some require a running integrated system/real environment.<\/p>\n"}, {"id": "l10-security-010", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q10 — Software supply-chain attacks", "prompt": "Explain dependency, build-infrastructure, and human vectors using Log4Shell, SolarWinds, and XZ; include SBOM value/limits.", "answer": "- **Log4Shell:** vulnerable dependency capability reachable via attacker-controlled strings → patch/upgrade, SCA, egress/JNDI hardening; SBOM helps locate affected versions.\n- **SolarWinds:** build/update pipeline compromise shipped trusted malicious artifacts → hardened isolated builds, signing/provenance/reproducibility; SBOM alone may still list legitimate components and miss a compromised build process.\n- **XZ:** social-engineering/maintainer-trust attack inserted a backdoor into release artifacts/build path → maintainer governance, review, provenance, reproducible builds; SBOM helps inventory but not human intent.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Explain dependency, build-infrastructure, and human vectors using Log4Shell, SolarWinds, and XZ; include SBOM value/limits.<\/p>\n", "answer_html": "<ul>\n<li><strong>Log4Shell:<\/strong> vulnerable dependency capability reachable via attacker-controlled strings → patch/upgrade, SCA, egress/JNDI hardening; SBOM helps locate affected versions.<\/li>\n<li><strong>SolarWinds:<\/strong> build/update pipeline compromise shipped trusted malicious artifacts → hardened isolated builds, signing/provenance/reproducibility; SBOM alone may still list legitimate components and miss a compromised build process.<\/li>\n<li><strong>XZ:<\/strong> social-engineering/maintainer-trust attack inserted a backdoor into release artifacts/build path → maintainer governance, review, provenance, reproducible builds; SBOM helps inventory but not human intent.<\/li>\n<\/ul>\n"}, {"id": "l10-security-011", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q11 — CVSS base, temporal, environmental", "prompt": "Explain 8.1→7.1→4.0 and decide emergency vs sprint patch; compare Log4Shell.", "answer": "**Base** describes intrinsic exploit/impact; **Temporal** adjusts for exploit maturity/fix/report confidence; **Environmental** adjusts for local asset importance/controls. Here unproven exploit + official fix lower temporal risk, and public data + WAF lowers local impact. A next-sprint patch can be defensible if exposure/controls are verified and monitoring exists; emergency patch if exploit evidence/exposure changes. Log4Shell was more urgent because **AC:L vs AC:H** and **Scope Changed vs Unchanged** (plus rapid exploit weaponization and initially difficult remediation) made real-world exploitation far easier.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Explain 8.1→7.1→4.0 and decide emergency vs sprint patch; compare Log4Shell.<\/p>\n", "answer_html": "<p><strong>Base<\/strong> describes intrinsic exploit/impact; <strong>Temporal<\/strong> adjusts for exploit maturity/fix/report confidence; <strong>Environmental<\/strong> adjusts for local asset importance/controls. Here unproven exploit + official fix lower temporal risk, and public data + WAF lowers local impact. A next-sprint patch can be defensible if exposure/controls are verified and monitoring exists; emergency patch if exploit evidence/exposure changes. Log4Shell was more urgent because <strong>AC:L vs AC:H<\/strong> and <strong>Scope Changed vs Unchanged<\/strong> (plus rapid exploit weaponization and initially difficult remediation) made real-world exploitation far easier.<\/p>\n"}, {"id": "l10-security-012", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q12 — Three-horizon fintech remediation", "prompt": "Prioritize SQLi, vulnerable Log4j, and missing auth threat model across immediate/quarter/year horizons.", "answer": "**Immediate:** patch/mitigate internet-exposed known RCE Log4j and SQLi in parallel; if forced to order, prioritize the finding with active exploitability + greatest reachable blast radius. Disable vulnerable features/WAF rules/network egress as temporary controls; parameterize queries and add regression tests. **Quarter:** SCA/SBOM, SAST, secret scanning, fuzz/security tests, security-review checklist/ownership. **Year:** recurring STRIDE + privacy/risk modeling, supply-chain provenance/reproducible builds, secure design training, metrics and incident feedback. Missing threat model is a program gap: start now, mature continuously.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Prioritize SQLi, vulnerable Log4j, and missing auth threat model across immediate/quarter/year horizons.<\/p>\n", "answer_html": "<p><strong>Immediate:<\/strong> patch/mitigate internet-exposed known RCE Log4j and SQLi in parallel; if forced to order, prioritize the finding with active exploitability + greatest reachable blast radius. Disable vulnerable features/WAF rules/network egress as temporary controls; parameterize queries and add regression tests. <strong>Quarter:<\/strong> SCA/SBOM, SAST, secret scanning, fuzz/security tests, security-review checklist/ownership. <strong>Year:<\/strong> recurring STRIDE + privacy/risk modeling, supply-chain provenance/reproducible builds, secure design training, metrics and incident feedback. Missing threat model is a program gap: start now, mature continuously.<\/p>\n"}];
const KEY='sqrs-progress-v1';
let progress=JSON.parse(localStorage.getItem(KEY)||'{}'), queue=[], index=0, revealed=false;
const $=id=>document.getElementById(id), now=()=>Date.now();
function save(){localStorage.setItem(KEY,JSON.stringify(progress));updateStats()}
function rec(c){return progress[c.id]||{reps:0,lapses:0,interval:0,due:0}}
function filtered(){const q=$('search').value.trim().toLowerCase(),t=$('topic').value,m=$('mode').value,n=now();return cards.filter(c=>{const r=rec(c);if(t&&c.topic!==t)return false;if(q&&!(`${c.prompt} ${c.topic} ${c.section}`.toLowerCase().includes(q)))return false;if(m==='due'&&!(r.reps>0&&r.due<=n))return false;if(m==='new'&&r.reps>0)return false;if(m==='trouble'&&r.lapses<1)return false;return true})}
function rebuild(keep=false){const current=keep&&queue[index]?.id;queue=filtered();index=Math.max(0,current?queue.findIndex(c=>c.id===current):0);if(index<0)index=0;revealed=false;render();updateStats()}
function updateStats(){const n=now();$('available').textContent=cards.length;$('due').textContent=cards.filter(c=>{const r=rec(c);return r.reps>0&&r.due<=n}).length;$('newCount').textContent=cards.filter(c=>rec(c).reps===0).length;$('reviewed').textContent=cards.filter(c=>rec(c).reps>0).length}
function render(){const host=$('study');if(!queue.length){host.innerHTML='<div class="empty">No cards match these filters.</div>';return}const c=queue[index%queue.length],r=rec(c);host.innerHTML=`<article class="card"><div class="card-meta"><span class="pill">${esc(c.topic)}</span><span class="origin">${esc(c.source_path)} · ${index+1}/${queue.length}</span></div><div class="content"><h2>${revealed?'Answer / cues':'Question'}</h2>${revealed?c.answer_html:c.prompt_html}</div>${revealed?`<div class="answer"><span class="pill">${esc(c.answer_kind)}</span><div class="source">${c.source_url?`<a href="${c.source_url}" target="_blank" rel="noopener">SQRBOK question set</a> · `:''}<a href="${c.github_url}" target="_blank" rel="noopener">course Markdown</a> · reviews: ${r.reps}, lapses: ${r.lapses}</div></div>`:''}</article><button class="flip" id="flip">${revealed?'Show question':'Reveal answer'} <span class="key">Space</span></button>${revealed?'<div class="controls"><button data-grade="again">Again <span class="key">1</span></button><button data-grade="hard">Hard <span class="key">2</span></button><button data-grade="good">Good <span class="key">3</span></button><button data-grade="easy">Easy <span class="key">4</span></button></div>':''}`;$('flip').onclick=flip;document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.grade))}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function flip(){revealed=!revealed;render()}
function grade(g){if(!queue.length)return;const c=queue[index%queue.length],r=rec(c),day=86400000;let interval=r.interval||0,lapses=r.lapses||0;if(g==='again'){interval=0;lapses++;r.due=now()+10*60*1000}else if(g==='hard'){interval=Math.max(1,Math.round(interval*1.2)||1);r.due=now()+interval*day}else if(g==='good'){interval=interval<=1?3:Math.max(3,Math.round(interval*2));r.due=now()+interval*day}else{interval=interval<=1?7:Math.max(7,Math.round(interval*3));r.due=now()+interval*day}progress[c.id]={reps:(r.reps||0)+1,lapses,interval,due:r.due,last:g};save();index=(index+1)%queue.length;revealed=false;render()}
function shuffle(){for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}index=0;revealed=false;render()}
[...new Set(cards.map(c=>c.topic))].forEach(t=>{const o=document.createElement('option');o.value=o.textContent=t;$('topic').appendChild(o)});
['search','topic','mode'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>rebuild()));$('shuffle').onclick=shuffle;$('reset').onclick=()=>{if(confirm('Clear all SQRS review progress in this browser?')){progress={};save();rebuild()}};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.code==='Space'){e.preventDefault();flip()}if(revealed&&['1','2','3','4'].includes(e.key))grade(({1:'again',2:'hard',3:'good',4:'easy'})[e.key])});rebuild();
</script></body></html>
