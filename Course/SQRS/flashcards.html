"l04-coverage-029", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q29 — Branch coverage vs mutation", "prompt": "What is the relationship between branch coverage and mutation testing? Does either subsume the other?", "answer": "They measure different things: branch coverage measures **structural traversal**; mutation measures whether tests **detect injected faults**. High branch coverage can have weak assertions and low mutation score; strong mutation tests may not imply every structural branch is covered. In general **neither subsumes the other**.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>What is the relationship between branch coverage and mutation testing? Does either subsume the other?<\/p>\n", "answer_html": "<p>They measure different things: branch coverage measures <strong>structural traversal<\/strong>; mutation measures whether tests <strong>detect injected faults<\/strong>. High branch coverage can have weak assertions and low mutation score; strong mutation tests may not imply every structural branch is covered. In general <strong>neither subsumes the other<\/strong>.<\/p>\n"}, {"id": "l04-coverage-030", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q30 — Why branch coverage is stronger", "prompt": "Give a code example showing 100% statement coverage can miss a fault that branch coverage exposes.", "answer": "Use an `if` without `else`: initialize `x=0`; if condition set `x=4`; then compute `z/x`. A true-condition test executes all statements but misses the false branch where x remains zero. Adding a false-condition test for branch coverage exposes the fault.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Give a code example showing 100% statement coverage can miss a fault that branch coverage exposes.<\/p>\n", "answer_html": "<p>Use an <code>if<\/code> without <code>else<\/code>: initialize <code>x=0<\/code>; if condition set <code>x=4<\/code>; then compute <code>z/x<\/code>. A true-condition test executes all statements but misses the false branch where x remains zero. Adding a false-condition test for branch coverage exposes the fault.<\/p>\n"}, {"id": "l04-coverage-031", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q31 — MC/DC for (A || B) && C", "prompt": "For `((A || B) && C)`, give multiple-condition count and a minimal MC/DC set with independence pairs.", "answer": "Multiple-condition coverage: **2^3 = 8**. One 4-test MC/DC set:\n- T1: A=T,B=F,C=T → T\n- T2: A=F,B=T,C=T → T\n- T3: A=F,B=F,C=T → F\n- T4: A=F,B=T,C=F → F\nPairs: A=T1↔T3; B=T2↔T3; C=T2↔T4.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>For <code>((A || B) &amp;&amp; C)<\/code>, give multiple-condition count and a minimal MC/DC set with independence pairs.<\/p>\n", "answer_html": "<p>Multiple-condition coverage: <strong>2^3 = 8<\/strong>. One 4-test MC/DC set:<\/p>\n<ul>\n<li>T1: A=T,B=F,C=T → T<\/li>\n<li>T2: A=F,B=T,C=T → T<\/li>\n<li>T3: A=F,B=F,C=T → F<\/li>\n<li>T4: A=F,B=T,C=F → F\nPairs: A=T1↔T3; B=T2↔T3; C=T2↔T4.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-032", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q32 — Critique “95% coverage = thoroughly tested”", "prompt": "Evaluate the claim that 95% code coverage proves thorough testing.", "answer": "Reject the inference, not the usefulness of the metric. Coverage says what code was traversed, not whether assertions were strong, requirements were complete, missing behavior was tested, or fault-revealing inputs were used. Cite size confounding, stronger association of assertions with effectiveness, and diminishing returns. Use coverage to find gaps alongside spec-based, mutation/data-flow, and oracle-quality evidence.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Evaluate the claim that 95% code coverage proves thorough testing.<\/p>\n", "answer_html": "<p>Reject the inference, not the usefulness of the metric. Coverage says what code was traversed, not whether assertions were strong, requirements were complete, missing behavior was tested, or fault-revealing inputs were used. Cite size confounding, stronger association of assertions with effectiveness, and diminishing returns. Use coverage to find gaps alongside spec-based, mutation/data-flow, and oracle-quality evidence.<\/p>\n"}, {"id": "l05-domain-001", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q1 — Core test definitions", "prompt": "Match test case, test suite, oracle, and test input to their definitions.", "answer": "- **Test input:** values supplied to the system.\n- **Oracle:** mechanism for deciding the correct/acceptable result.\n- **Test case:** input plus expected result/oracle/context.\n- **Test suite:** collection of test cases.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Match test case, test suite, oracle, and test input to their definitions.<\/p>\n", "answer_html": "<ul>\n<li><strong>Test input:<\/strong> values supplied to the system.<\/li>\n<li><strong>Oracle:<\/strong> mechanism for deciding the correct/acceptable result.<\/li>\n<li><strong>Test case:<\/strong> input plus expected result/oracle/context.<\/li>\n<li><strong>Test suite:<\/strong> collection of test cases.<\/li>\n<\/ul>\n"}, {"id": "l05-domain-002", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q2 — Positive test bias", "prompt": "What is positive test bias and how does it affect coverage?", "answer": "Testers naturally choose inputs they expect to work. This over-samples valid/normal partitions and under-samples invalid, boundary, and adversarial cases. Counter it with explicit negative-test planning, partitioning, and incentives to find failures rather than merely confirm success.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>What is positive test bias and how does it affect coverage?<\/p>\n", "answer_html": "<p>Testers naturally choose inputs they expect to work. This over-samples valid/normal partitions and under-samples invalid, boundary, and adversarial cases. Counter it with explicit negative-test planning, partitioning, and incentives to find failures rather than merely confirm success.<\/p>\n"}, {"id": "l05-domain-003", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q3 — Black-box choice for a payment API", "prompt": "With no source-code access, what approach should test a payment gateway and why?", "answer": "Use **black-box/specification-based testing**: derive equivalence partitions, boundaries, decision tables, state/contract cases, and negative inputs from the API specification and observable behavior. White-box structural criteria require implementation access.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>With no source-code access, what approach should test a payment gateway and why?<\/p>\n", "answer_html": "<p>Use <strong>black-box/specification-based testing<\/strong>: derive equivalence partitions, boundaries, decision tables, state/contract cases, and negative inputs from the API specification and observable behavior. White-box structural criteria require implementation access.<\/p>\n"}, {"id": "l05-domain-004", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q4 — Equivalence-partition properties", "prompt": "What two properties must equivalence partitions satisfy?", "answer": "They must be **complete/exhaustive** (every possible input is in some partition) and **disjoint** (no input belongs to more than one partition for that partitioning dimension).", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>What two properties must equivalence partitions satisfy?<\/p>\n", "answer_html": "<p>They must be <strong>complete/exhaustive<\/strong> (every possible input is in some partition) and <strong>disjoint<\/strong> (no input belongs to more than one partition for that partitioning dimension).<\/p>\n"}, {"id": "l05-domain-005", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q5 — Weak vs strong EP counts", "prompt": "A has 4 classes, B has 3, C has 5. Compute weak and strong EP counts.", "answer": "Using the lecture formulas: **weak EP = max(4,3,5)=5** tests; **strong EP = 4×3×5=60** combinations.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>A has 4 classes, B has 3, C has 5. Compute weak and strong EP counts.<\/p>\n", "answer_html": "<p>Using the lecture formulas: <strong>weak EP = max(4,3,5)=5<\/strong> tests; <strong>strong EP = 4×3×5=60<\/strong> combinations.<\/p>\n"}, {"id": "l05-domain-006", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q6 — Email equivalence classes", "prompt": "Give at least five useful equivalence classes for email validation.", "answer": "Possible classes: valid normal address; missing `@`; empty local part; empty domain; invalid/missing top-level domain; illegal characters; too-long local/domain/address; Unicode/IDN case; whitespace/control characters. Define expected behavior for each.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Give at least five useful equivalence classes for email validation.<\/p>\n", "answer_html": "<p>Possible classes: valid normal address; missing <code>@<\/code>; empty local part; empty domain; invalid/missing top-level domain; illegal characters; too-long local/domain/address; Unicode/IDN case; whitespace/control characters. Define expected behavior for each.<\/p>\n"}, {"id": "l05-domain-007", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q7 — Partition heuristics", "prompt": "Match range-based, enumeration, and error-type partitioning to examples.", "answer": "- Age bands → **range-based**.\n- US regions / finite named options → **enumeration**.\n- Inputs that trigger “file not found” → **error-type** partition.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Match range-based, enumeration, and error-type partitioning to examples.<\/p>\n", "answer_html": "<ul>\n<li>Age bands → <strong>range-based<\/strong>.<\/li>\n<li>US regions / finite named options → <strong>enumeration<\/strong>.<\/li>\n<li>Inputs that trigger “file not found” → <strong>error-type<\/strong> partition.<\/li>\n<\/ul>\n"}, {"id": "l05-domain-008", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q8 — Boundary fault types", "prompt": "Classify `<` vs `<=`, wrong numeric boundary, and missing upper bound.", "answer": "- `<` should be `<=` → **closure bug**.\n- `<10` should be `<11` → **boundary shift**.\n- No upper-bound condition → **missing boundary**.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Classify <code>&lt;<\/code> vs <code>&lt;=<\/code>, wrong numeric boundary, and missing upper bound.<\/p>\n", "answer_html": "<ul>\n<li><code>&lt;<\/code> should be <code>&lt;=<\/code> → <strong>closure bug<\/strong>.<\/li>\n<li><code>&lt;10<\/code> should be <code>&lt;11<\/code> → <strong>boundary shift<\/strong>.<\/li>\n<li>No upper-bound condition → <strong>missing boundary<\/strong>.<\/li>\n<\/ul>\n"}, {"id": "l05-domain-009", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q9 — ON/OFF points for x >= 100", "prompt": "Identify ON and OFF points and whether the boundary is open/closed.", "answer": "For integer x: **ON = 100** (exact boundary), **OFF = 99** (just outside the accepted region). `>=` is a **closed** boundary because the boundary value is included.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Identify ON and OFF points and whether the boundary is open/closed.<\/p>\n", "answer_html": "<p>For integer x: <strong>ON = 100<\/strong> (exact boundary), <strong>OFF = 99<\/strong> (just outside the accepted region). <code>&gt;=<\/code> is a <strong>closed<\/strong> boundary because the boundary value is included.<\/p>\n"}, {"id": "l05-domain-010", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q10 — BVA test counts", "prompt": "For three input variables, compute basic and robust BVA counts.", "answer": "Basic BVA = 4k+1 = 4×3+1 = **13**. Robust BVA = 6k+1 = 6×3+1 = **19**.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>For three input variables, compute basic and robust BVA counts.<\/p>\n", "answer_html": "<p>Basic BVA = 4k+1 = 4×3+1 = <strong>13<\/strong>. Robust BVA = 6k+1 = 6×3+1 = <strong>19<\/strong>.<\/p>\n"}, {"id": "l05-domain-011", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q11 — Open interval test points", "prompt": "For valid range `1 < x < 100`, which boundary points should be tested?", "answer": "For integer input, test the boundaries and immediately-inside values: **1 (ON, invalid), 2 (OFF/inside), 99 (inside), 100 (ON, invalid)**, plus a nominal interior value for a basic set. The key is testing both processing regions adjacent to each open boundary.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>For valid range <code>1 &lt; x &lt; 100<\/code>, which boundary points should be tested?<\/p>\n", "answer_html": "<p>For integer input, test the boundaries and immediately-inside values: <strong>1 (ON, invalid), 2 (OFF/inside), 99 (inside), 100 (ON, invalid)<\/strong>, plus a nominal interior value for a basic set. The key is testing both processing regions adjacent to each open boundary.<\/p>\n"}, {"id": "l05-domain-012", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q12 — BVA limitations", "prompt": "Name three limitations of boundary value analysis.", "answer": "BVA assumes faults cluster at boundaries; it does not systematically cover interactions among many parameters; it depends on identifying the right partitions/boundaries; and it does not solve oracle, state/history, timing, or missing-requirement problems. Any three with explanation are sufficient.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Name three limitations of boundary value analysis.<\/p>\n", "answer_html": "<p>BVA assumes faults cluster at boundaries; it does not systematically cover interactions among many parameters; it depends on identifying the right partitions/boundaries; and it does not solve oracle, state/history, timing, or missing-requirement problems. Any three with explanation are sufficient.<\/p>\n"}, {"id": "l05-domain-013", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q13 — Decision-table components", "prompt": "What are the four main components of a decision table?", "answer": "**Conditions**, **condition values/entries**, **actions/responses**, and **rules** (columns mapping a combination of condition values to actions).", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>What are the four main components of a decision table?<\/p>\n", "answer_html": "<p><strong>Conditions<\/strong>, <strong>condition values/entries<\/strong>, <strong>actions/responses<\/strong>, and <strong>rules<\/strong> (columns mapping a combination of condition values to actions).<\/p>\n"}, {"id": "l05-domain-014", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q14 — Decision-table rule count", "prompt": "Three independent binary conditions: how many complete rules before consolidation?", "answer": "2^3 = **8 rules**.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Three independent binary conditions: how many complete rules before consolidation?<\/p>\n", "answer_html": "<p>2^3 = <strong>8 rules<\/strong>.<\/p>\n"}, {"id": "l05-domain-015", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q15 — Decision-table checksum", "prompt": "Five consolidated rules cover {2,3,1,4,2} original rules. Is that valid for a 12-rule original table?", "answer": "The cover counts sum to 2+3+1+4+2 = **12**, so the checksum passes. You still need to verify the merged rules truly have identical actions and valid don't-care conditions.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Five consolidated rules cover {2,3,1,4,2} original rules. Is that valid for a 12-rule original table?<\/p>\n", "answer_html": "<p>The cover counts sum to 2+3+1+4+2 = <strong>12<\/strong>, so the checksum passes. You still need to verify the merged rules truly have identical actions and valid don't-care conditions.<\/p>\n"}, {"id": "l05-domain-016", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q16 — Beizer decision-table method", "prompt": "Put the eight decision-table steps in order.", "answer": "A useful order: **list actions → list conditions/values → calculate rule count → enumerate combinations → specify actions per rule → consolidate common-action rules with don't-cares → verify checksum → derive tests (one per resulting rule)**.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Put the eight decision-table steps in order.<\/p>\n", "answer_html": "<p>A useful order: <strong>list actions → list conditions/values → calculate rule count → enumerate combinations → specify actions per rule → consolidate common-action rules with don't-cares → verify checksum → derive tests (one per resulting rule)<\/strong>.<\/p>\n"}, {"id": "l05-domain-017", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q17 — When decision tables fit", "prompt": "Which scenarios fit decision tables: tax rules, load performance, role/department/time access, continuous temperature prediction?", "answer": "Good fits are logic with discrete interacting conditions: **tax calculation** and **access control**. Load-performance behavior and continuous prediction are not primarily decision-table problems.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Which scenarios fit decision tables: tax rules, load performance, role/department/time access, continuous temperature prediction?<\/p>\n", "answer_html": "<p>Good fits are logic with discrete interacting conditions: <strong>tax calculation<\/strong> and <strong>access control<\/strong>. Load-performance behavior and continuous prediction are not primarily decision-table problems.<\/p>\n"}, {"id": "l05-domain-018", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q18 — Low-order interaction finding", "prompt": "What fraction of failures are triggered by one- or two-way parameter interactions?", "answer": "The lecture uses the memorable rule **about 90%**; the cited interaction datasets often show roughly **93% cumulative by 2-way**. The point is that pairwise covers a large majority, not all, interaction faults.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>What fraction of failures are triggered by one- or two-way parameter interactions?<\/p>\n", "answer_html": "<p>The lecture uses the memorable rule <strong>about 90%<\/strong>; the cited interaction datasets often show roughly <strong>93% cumulative by 2-way<\/strong>. The point is that pairwise covers a large majority, not all, interaction faults.<\/p>\n"}, {"id": "l05-domain-019", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q19 — 34 binary switches: exhaustive vs pairwise", "prompt": "Compare test counts for all combinations and a pairwise suite.", "answer": "Exhaustive = 2^34 = **17,179,869,184** combinations. The lecture example uses about **29 pairwise tests**—an enormous reduction while still covering every value pair.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Compare test counts for all combinations and a pairwise suite.<\/p>\n", "answer_html": "<p>Exhaustive = 2^34 = <strong>17,179,869,184<\/strong> combinations. The lecture example uses about <strong>29 pairwise tests<\/strong>—an enormous reduction while still covering every value pair.<\/p>\n"}, {"id": "l05-domain-020", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q20 — Selecting interaction strength", "prompt": "Map general UI, business-critical finance, and safety-critical medical software to typical interaction strengths.", "answer": "Lecture guideline: **2-way** for general/UI applications; around **3-way** for business-critical systems; **4–6 way** (plus other assurance techniques) for safety-critical/medical contexts. Risk, constraints, and evidence can justify different choices.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Map general UI, business-critical finance, and safety-critical medical software to typical interaction strengths.<\/p>\n", "answer_html": "<p>Lecture guideline: <strong>2-way<\/strong> for general/UI applications; around <strong>3-way<\/strong> for business-critical systems; <strong>4–6 way<\/strong> (plus other assurance techniques) for safety-critical/medical contexts. Risk, constraints, and evidence can justify different choices.<\/p>\n"}, {"id": "l05-domain-021", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q21 — Combinatorial-testing limits", "prompt": "Name three limitations of combinatorial testing.", "answer": "It depends on correct parameter/value modeling; pairwise misses higher-order interactions; temporal/stateful behavior may not be represented; constraints/masking complicate generation; generated cases still need oracles. Combine it with EP/BVA and other techniques.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Name three limitations of combinatorial testing.<\/p>\n", "answer_html": "<p>It depends on correct parameter/value modeling; pairwise misses higher-order interactions; temporal/stateful behavior may not be represented; constraints/masking complicate generation; generated cases still need oracles. Combine it with EP/BVA and other techniques.<\/p>\n"}, {"id": "l05-domain-022", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q22 — Technique matching", "prompt": "Pick the primary technique for numeric range, many configuration options, ATM multi-condition logic, and user-role categories.", "answer": "- Numeric range 1–100 → **BVA** (after EP).\n- 20 configuration options → **pairwise/combinatorial**.\n- ATM with interacting rules → **decision table**.\n- Admin/manager/user/guest → **equivalence partitioning**.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Pick the primary technique for numeric range, many configuration options, ATM multi-condition logic, and user-role categories.<\/p>\n", "answer_html": "<ul>\n<li>Numeric range 1–100 → <strong>BVA<\/strong> (after EP).<\/li>\n<li>20 configuration options → <strong>pairwise/combinatorial<\/strong>.<\/li>\n<li>ATM with interacting rules → <strong>decision table<\/strong>.<\/li>\n<li>Admin/manager/user/guest → <strong>equivalence partitioning<\/strong>.<\/li>\n<\/ul>\n"}, {"id": "l05-domain-023", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q23 — Combining input-domain techniques", "prompt": "What order should EP, BVA, decision tables, and pairwise be combined?", "answer": "**Start with EP → refine boundaries with BVA → model complex conditional logic with decision tables → use pairwise/combinatorial generation when many parameters make combinations explode.** Pairwise optimizes a model; it should not replace good partitioning.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>What order should EP, BVA, decision tables, and pairwise be combined?<\/p>\n", "answer_html": "<p><strong>Start with EP → refine boundaries with BVA → model complex conditional logic with decision tables → use pairwise/combinatorial generation when many parameters make combinations explode.<\/strong> Pairwise optimizes a model; it should not replace good partitioning.<\/p>\n"}, {"id": "l05-domain-024", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q24 — Why BVA complements EP", "prompt": "Explain why BVA complements rather than replaces equivalence partitioning.", "answer": "EP chooses representative values from behaviorally similar regions; BVA targets the edges **between** those regions where off-by-one/closure faults cluster. Example: EP for age {underage, adult, senior}; BVA explicitly tests 17/18 and 64/65 around class boundaries.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Explain why BVA complements rather than replaces equivalence partitioning.<\/p>\n", "answer_html": "<p>EP chooses representative values from behaviorally similar regions; BVA targets the edges <strong>between<\/strong> those regions where off-by-one/closure faults cluster. Example: EP for age {underage, adult, senior}; BVA explicitly tests 17/18 and 64/65 around class boundaries.<\/p>\n"}, {"id": "l05-domain-025", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q25 — Login decision table", "prompt": "Build and consolidate a decision table for username valid?, password valid?, account active?.", "answer": "Start with 8 binary combinations. A compact consolidation can be:\n1. Username invalid → reject (password/account don't care): covers 4.\n2. Username valid, password invalid → reject: covers 2.\n3. Username+password valid, account inactive → inactive/blocked: covers 1.\n4. All valid/active → login success: covers 1.\nChecksum 4+2+1+1=8.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Build and consolidate a decision table for username valid?, password valid?, account active?.<\/p>\n", "answer_html": "<p>Start with 8 binary combinations. A compact consolidation can be:<\/p>\n<ol>\n<li>Username invalid → reject (password/account don't care): covers 4.<\/li>\n<li>Username valid, password invalid → reject: covers 2.<\/li>\n<li>Username+password valid, account inactive → inactive/blocked: covers 1.<\/li>\n<li>All valid/active → login success: covers 1.\nChecksum 4+2+1+1=8.<\/li>\n<\/ol>\n"}, {"id": "l05-domain-026", "topic": "L05 — Input Domain Testing", "section": "L05 — Input Domain Testing", "label": "Q26 — Pairwise-only safety-critical testing", "prompt": "Evaluate using only pairwise testing for a medical-device control system.", "answer": "Pairwise alone is insufficient: it intentionally ignores many 3+ way interactions and does not address timing, state, structural coverage, hazards, or oracle quality. Use risk-driven higher-strength combinations plus requirements/hazard analysis, BVA/decision tables, structural criteria such as MC/DC where applicable, static analysis, reviews, and system validation.", "answer_kind": "answer / self-check", "source_path": "L05_Domain.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L05_Domain.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L05_Domain.md", "prompt_html": "<p>Evaluate using only pairwise testing for a medical-device control system.<\/p>\n", "answer_html": "<p>Pairwise alone is insufficient: it intentionally ignores many 3+ way interactions and does not address timing, state, structural coverage, hazards, or oracle quality. Use risk-driven higher-strength combinations plus requirements/hazard analysis, BVA/decision tables, structural criteria such as MC/DC where applicable, static analysis, reviews, and system validation.<\/p>\n"}, {"id": "l06-random-001", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q1 — What makes random testing random?", "prompt": "State Hamlet's three conditions for technically random testing.", "answer": "1. A **defined input distribution** (uniform or operational profile).\n2. **Independent** random selections from that distribution.\n3. An **oracle** that can automatically decide pass/fail.\nRandom testing is statistical sampling, not haphazard picking.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>State Hamlet's three conditions for technically random testing.<\/p>\n", "answer_html": "<ol>\n<li>A <strong>defined input distribution<\/strong> (uniform or operational profile).<\/li>\n<li><strong>Independent<\/strong> random selections from that distribution.<\/li>\n<li>An <strong>oracle<\/strong> that can automatically decide pass/fail.\nRandom testing is statistical sampling, not haphazard picking.<\/li>\n<\/ol>\n"}, {"id": "l06-random-002", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q2 — When partition testing beats random", "prompt": "When is random testing a poor choice relative to partition testing?", "answer": "When the input space has known rare but high-risk regions/boundaries, pure random sampling may almost never hit them. If domain knowledge supports meaningful partitions, BVA/EP can allocate tests deliberately to those regions. Random excels when structure is weak or high-volume statistical evidence is the goal.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>When is random testing a poor choice relative to partition testing?<\/p>\n", "answer_html": "<p>When the input space has known rare but high-risk regions/boundaries, pure random sampling may almost never hit them. If domain knowledge supports meaningful partitions, BVA/EP can allocate tests deliberately to those regions. Random excels when structure is weak or high-volume statistical evidence is the goal.<\/p>\n"}, {"id": "l06-random-003", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q3 — No failures does not mean bug-free", "prompt": "Why does 10,000 failure-free random tests not prove correctness? Use C=1−(1−F)^N.", "answer": "No finite random sample proves zero failure probability. It supports a bound relative to an assumed failure rate/distribution. For target F=10^-4 and N=10,000, confidence is only **≈63.2%** that at least one failure would have appeared if the true rate were 1 in 10,000. The conclusion is statistical, not absolute.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why does 10,000 failure-free random tests not prove correctness? Use C=1−(1−F)^N.<\/p>\n", "answer_html": "<p>No finite random sample proves zero failure probability. It supports a bound relative to an assumed failure rate/distribution. For target F=10^-4 and N=10,000, confidence is only <strong>≈63.2%<\/strong> that at least one failure would have appeared if the true rate were 1 in 10,000. The conclusion is statistical, not absolute.<\/p>\n"}, {"id": "l06-random-004", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q4 — Random tests for 95% confidence", "prompt": "How many failure-free tests give 95% confidence that F < 1/10,000?", "answer": "N = ln(1−0.95)/ln(1−0.0001) ≈ **29,956 tests** (round up).", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>How many failure-free tests give 95% confidence that F &lt; 1/10,000?<\/p>\n", "answer_html": "<p>N = ln(1−0.95)/ln(1−0.0001) ≈ <strong>29,956 tests<\/strong> (round up).<\/p>\n"}, {"id": "l06-random-005", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q5 — Randoop plateau effect", "prompt": "What is the plateau effect in feedback-directed random testing and why does it happen?", "answer": "After initial rapid discovery, new sequences increasingly revisit already-explored states/behaviors; reachable novelty becomes harder to generate, so coverage and bug-finding rates flatten. The lecture notes Randoop's error-finding rate dropping toward zero after roughly a dozen hours in the cited study.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What is the plateau effect in feedback-directed random testing and why does it happen?<\/p>\n", "answer_html": "<p>After initial rapid discovery, new sequences increasingly revisit already-explored states/behaviors; reachable novelty becomes harder to generate, so coverage and bug-finding rates flatten. The lecture notes Randoop's error-finding rate dropping toward zero after roughly a dozen hours in the cited study.<\/p>\n"}, {"id": "l06-random-006", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q6 — Hamlet: when only random testing will do", "prompt": "Name two situations Hamlet argues require random testing.", "answer": "- **Large/unstructured domains** with no principled basis for partitioning.\n- **Persistent-state systems**, where valid tests are input sequences from reset and arbitrary sampled internal states may be unreachable.\nRandom sampling preserves the real reachable-state distribution.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Name two situations Hamlet argues require random testing.<\/p>\n", "answer_html": "<ul>\n<li><strong>Large/unstructured domains<\/strong> with no principled basis for partitioning.<\/li>\n<li><strong>Persistent-state systems<\/strong>, where valid tests are input sequences from reset and arbitrary sampled internal states may be unreachable.\nRandom sampling preserves the real reachable-state distribution.<\/li>\n<\/ul>\n"}, {"id": "l06-random-007", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q7 — Oracle strength limits random testing", "prompt": "Compare crash, sanitizer, property, and differential oracles.", "answer": "- **Crash/hang:** very cheap, finds catastrophic failures only.\n- **Sanitizers:** detect memory/undefined/thread errors during execution.\n- **Properties/assertions:** check semantic invariants and widen bug classes.\n- **Differential oracle:** compare implementations/models to detect wrong outputs.\nInput generation can be excellent, but the oracle determines what failures become visible.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Compare crash, sanitizer, property, and differential oracles.<\/p>\n", "answer_html": "<ul>\n<li><strong>Crash/hang:<\/strong> very cheap, finds catastrophic failures only.<\/li>\n<li><strong>Sanitizers:<\/strong> detect memory/undefined/thread errors during execution.<\/li>\n<li><strong>Properties/assertions:<\/strong> check semantic invariants and widen bug classes.<\/li>\n<li><strong>Differential oracle:<\/strong> compare implementations/models to detect wrong outputs.\nInput generation can be excellent, but the oracle determines what failures become visible.<\/li>\n<\/ul>\n"}, {"id": "l06-random-008", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q8 — Fuzzing vs general random testing", "prompt": "How does fuzzing differ from random testing and when should fuzzing be preferred?", "answer": "Random testing samples a defined input distribution for broad/statistical goals. Fuzzing aggressively mutates/generates malformed inputs, usually guided by crashes, sanitizers, or coverage, to maximize fault discovery—especially parser, memory-safety, robustness, and security bugs. Choose fuzzing when adversarial input handling is central.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>How does fuzzing differ from random testing and when should fuzzing be preferred?<\/p>\n", "answer_html": "<p>Random testing samples a defined input distribution for broad/statistical goals. Fuzzing aggressively mutates/generates malformed inputs, usually guided by crashes, sanitizers, or coverage, to maximize fault discovery—especially parser, memory-safety, robustness, and security bugs. Choose fuzzing when adversarial input handling is central.<\/p>\n"}, {"id": "l06-random-009", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q9 — Three generations of fuzzing", "prompt": "Describe black-box, white-box, and grey-box fuzzing and why grey-box dominates.", "answer": "- **Black-box:** random/mutational inputs without program feedback.\n- **White-box:** symbolic/concolic execution and constraint solving.\n- **Grey-box:** lightweight coverage feedback guides mutations (AFL/libFuzzer).\nGrey-box combines very high execution throughput with enough feedback to reach new code, avoiding much of symbolic execution's path/solver cost.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Describe black-box, white-box, and grey-box fuzzing and why grey-box dominates.<\/p>\n", "answer_html": "<ul>\n<li><strong>Black-box:<\/strong> random/mutational inputs without program feedback.<\/li>\n<li><strong>White-box:<\/strong> symbolic/concolic execution and constraint solving.<\/li>\n<li><strong>Grey-box:<\/strong> lightweight coverage feedback guides mutations (AFL/libFuzzer).\nGrey-box combines very high execution throughput with enough feedback to reach new code, avoiding much of symbolic execution's path/solver cost.<\/li>\n<\/ul>\n"}, {"id": "l06-random-010", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q10 — Persistent fuzz bug classes", "prompt": "What does recurrence of similar fuzz-found bug classes over 16 years imply?", "answer": "Tooling improved, but organizations repeatedly reintroduced the same robustness/input-handling mistakes. This suggests security/reliability is not solved by one tool generation: prevention, safer APIs/languages, regression suites, and continuous fuzzing must accompany discovery.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What does recurrence of similar fuzz-found bug classes over 16 years imply?<\/p>\n", "answer_html": "<p>Tooling improved, but organizations repeatedly reintroduced the same robustness/input-handling mistakes. This suggests security/reliability is not solved by one tool generation: prevention, safer APIs/languages, regression suites, and continuous fuzzing must accompany discovery.<\/p>\n"}, {"id": "l06-random-011", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q11 — Directed grey-box fuzzing", "prompt": "What is directed grey-box fuzzing, and why can AFLGo beat symbolic execution on targets like Heartbleed?", "answer": "It biases coverage-guided mutation toward code locations of interest (e.g. changed/vulnerable functions). It keeps fuzzing throughput high and uses distance feedback rather than solving every path constraint. This can reach deep real paths quickly where symbolic execution suffers path explosion/solver difficulty; the lecture cites Heartbleed in ~20 min vs >24 h.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What is directed grey-box fuzzing, and why can AFLGo beat symbolic execution on targets like Heartbleed?<\/p>\n", "answer_html": "<p>It biases coverage-guided mutation toward code locations of interest (e.g. changed/vulnerable functions). It keeps fuzzing throughput high and uses distance feedback rather than solving every path constraint. This can reach deep real paths quickly where symbolic execution suffers path explosion/solver difficulty; the lecture cites Heartbleed in ~20 min vs &gt;24 h.<\/p>\n"}, {"id": "l06-random-012", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q12 — Crashes are not bugs", "prompt": "Why is “57,142 unique crashes = 9 bugs” important?", "answer": "Crash deduplication heuristics dramatically overcount root causes: many inputs/stack traces can trigger the same defect. Evaluate fuzzers by **distinct confirmed bugs**, with repeated trials and statistical comparison—not raw crash-file counts.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why is “57,142 unique crashes = 9 bugs” important?<\/p>\n", "answer_html": "<p>Crash deduplication heuristics dramatically overcount root causes: many inputs/stack traces can trigger the same defect. Evaluate fuzzers by <strong>distinct confirmed bugs<\/strong>, with repeated trials and statistical comparison—not raw crash-file counts.<\/p>\n"}, {"id": "l06-random-013", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q13 — Why multiple fuzzers help", "prompt": "Why can a portfolio of fuzzers find substantially more bugs than any one?", "answer": "Fuzzers differ in mutation operators, seed handling, instrumentation, search heuristics, and path biases. Their coverage/failure sets are only partly overlapping; diversity reduces correlated blind spots, so combining tools often finds many additional bugs.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why can a portfolio of fuzzers find substantially more bugs than any one?<\/p>\n", "answer_html": "<p>Fuzzers differ in mutation operators, seed handling, instrumentation, search heuristics, and path biases. Their coverage/failure sets are only partly overlapping; diversity reduces correlated blind spots, so combining tools often finds many additional bugs.<\/p>\n"}, {"id": "l06-random-014", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q14 — QuickCheck bug distribution", "prompt": "Why is finding bugs in implementations, specifications, and generators surprising/useful?", "answer": "PBT is not only testing the implementation: writing executable properties exposes **specification mistakes**, and generators/shrinkers are themselves test infrastructure that can be wrong. Roughly one-third in each category shows that formalizing properties improves the whole testing model.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why is finding bugs in implementations, specifications, and generators surprising/useful?<\/p>\n", "answer_html": "<p>PBT is not only testing the implementation: writing executable properties exposes <strong>specification mistakes<\/strong>, and generators/shrinkers are themselves test infrastructure that can be wrong. Roughly one-third in each category shows that formalizing properties improves the whole testing model.<\/p>\n"}, {"id": "l06-random-015", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q15 — Hypothesis byte-stream representation", "prompt": "What problem does a universal byte-stream representation solve?", "answer": "It separates complex typed generation from the underlying search/shrink representation. Hypothesis can shrink and mutate a generic byte stream, then map it into structured values, avoiding a bespoke shrinker/search strategy for every data type and enabling reusable feedback.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What problem does a universal byte-stream representation solve?<\/p>\n", "answer_html": "<p>It separates complex typed generation from the underlying search/shrink representation. Hypothesis can shrink and mutate a generic byte stream, then map it into structured values, avoiding a bespoke shrinker/search strategy for every data type and enabling reusable feedback.<\/p>\n"}, {"id": "l06-random-016", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q16 — Why JQF is ~1000× better than random PBT", "prompt": "How does JQF/Zest achieve the reported improvement?", "answer": "It combines **property-based structured generators** with **coverage-guided fuzzing**. Inputs remain semantically valid/structured, while coverage feedback evolves seeds toward new program behavior. The cited benchmark found a bug in ~5k executions that random PBT missed after millions.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>How does JQF/Zest achieve the reported improvement?<\/p>\n", "answer_html": "<p>It combines <strong>property-based structured generators<\/strong> with <strong>coverage-guided fuzzing<\/strong>. Inputs remain semantically valid/structured, while coverage feedback evolves seeds toward new program behavior. The cited benchmark found a bug in ~5k executions that random PBT missed after millions.<\/p>\n"}, {"id": "l06-random-017", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q17 — The hardest part of PBT", "prompt": "Why do practitioners struggle to know which properties to test?", "answer": "Examples specify one expected result; properties must express general truths across huge input spaces. Useful invariants often require deep domain knowledge, alternate models, round trips, metamorphic relations, or differential oracles. The generator is usually easier than discovering a powerful invariant.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why do practitioners struggle to know which properties to test?<\/p>\n", "answer_html": "<p>Examples specify one expected result; properties must express general truths across huge input spaces. Useful invariants often require deep domain knowledge, alternate models, round trips, metamorphic relations, or differential oracles. The generator is usually easier than discovering a powerful invariant.<\/p>\n"}, {"id": "l06-random-018", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q18 — PBT vs fuzzing time budgets", "prompt": "What do short PBT runs vs hours/days of fuzzing imply about integration?", "answer": "PBT is commonly a **developer/CI test** with fast feedback (milliseconds to seconds). Fuzzing is often a **continuous/campaign** activity that spends long budgets exploring coverage. They can share generators/oracles, but operate at different feedback loops.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What do short PBT runs vs hours/days of fuzzing imply about integration?<\/p>\n", "answer_html": "<p>PBT is commonly a <strong>developer/CI test<\/strong> with fast feedback (milliseconds to seconds). Fuzzing is often a <strong>continuous/campaign<\/strong> activity that spends long budgets exploring coverage. They can share generators/oracles, but operate at different feedback loops.<\/p>\n"}, {"id": "l06-random-019", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q19 — Coupling effect", "prompt": "Explain the mutation-testing coupling effect.", "answer": "Complex faults are often coupled to simple faults: a test set capable of killing simple mutants tends also to kill the vast majority of more complex mutants. This motivates using a small set of simple mutation operators instead of generating every possible complex mutant.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Explain the mutation-testing coupling effect.<\/p>\n", "answer_html": "<p>Complex faults are often coupled to simple faults: a test set capable of killing simple mutants tends also to kill the vast majority of more complex mutants. This motivates using a small set of simple mutation operators instead of generating every possible complex mutant.<\/p>\n"}, {"id": "l06-random-020", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q20 — Equivalent mutant problem", "prompt": "Why are equivalent mutants persistently difficult?", "answer": "An equivalent mutant changes syntax but not observable program behavior for any input, so no test can kill it. Determining semantic equivalence is undecidable in general; 10–40% equivalence rates can waste analysis effort and distort mutation scores unless filtered.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why are equivalent mutants persistently difficult?<\/p>\n", "answer_html": "<p>An equivalent mutant changes syntax but not observable program behavior for any input, so no test can kill it. Determining semantic equivalence is undecidable in general; 10–40% equivalence rates can waste analysis effort and distort mutation scores unless filtered.<\/p>\n"}, {"id": "l06-random-021", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q21 — Small code model vs GPT-4 for mutant equivalence", "prompt": "Why might a 110M code-specific model outperform a much larger general model?", "answer": "Task/data alignment can matter more than parameter count: a model trained/fine-tuned on code representations and the exact equivalence task learns structural signals that a general conversational model may not. The lecture cites UniXCoder ~86.6% F1 vs GPT-4 ~55.9% on that benchmark; treat it as task-specific evidence, not a universal model ranking.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why might a 110M code-specific model outperform a much larger general model?<\/p>\n", "answer_html": "<p>Task/data alignment can matter more than parameter count: a model trained/fine-tuned on code representations and the exact equivalence task learns structural signals that a general conversational model may not. The lecture cites UniXCoder ~86.6% F1 vs GPT-4 ~55.9% on that benchmark; treat it as task-specific evidence, not a universal model ranking.<\/p>\n"}, {"id": "l06-random-022", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q22 — Crossfire in mutation testing", "prompt": "What is the crossfire phenomenon?", "answer": "A single well-designed test often kills **multiple mutants**. Mutation-guided test improvement therefore has compounding returns: you do not necessarily need one new test per surviving mutant.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What is the crossfire phenomenon?<\/p>\n", "answer_html": "<p>A single well-designed test often kills <strong>multiple mutants<\/strong>. Mutation-guided test improvement therefore has compounding returns: you do not necessarily need one new test per surviving mutant.<\/p>\n"}, {"id": "l06-random-023", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q23 — Should mutation score reach 100%?", "prompt": "A team has 85% mutation score. Should it automatically chase 100%?", "answer": "Not automatically. Surviving mutants may be equivalent, trivial, unreachable, or extremely costly to target; returns diminish near the top. Investigate high-value survivors, exclude justified equivalents, and prioritize risk. 100% is meaningful only if the mutant set and oracle justify it.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>A team has 85% mutation score. Should it automatically chase 100%?<\/p>\n", "answer_html": "<p>Not automatically. Surviving mutants may be equivalent, trivial, unreachable, or extremely costly to target; returns diminish near the top. Investigate high-value survivors, exclude justified equivalents, and prioritize risk. 100% is meaningful only if the mutant set and oracle justify it.<\/p>\n"}, {"id": "l06-random-024", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q24 — Mutation testing vs PBT", "prompt": "Compare how mutation testing and property-based testing improve test quality.", "answer": "**Mutation** perturbs the program and asks whether the existing suite notices—an oracle/test-strength assessment. **PBT** generates many inputs from a model and checks general properties—an input/oracle generation strategy. Together, mutation can expose weak properties while PBT can generate cases that kill mutants.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Compare how mutation testing and property-based testing improve test quality.<\/p>\n", "answer_html": "<p><strong>Mutation<\/strong> perturbs the program and asks whether the existing suite notices—an oracle/test-strength assessment. <strong>PBT<\/strong> generates many inputs from a model and checks general properties—an input/oracle generation strategy. Together, mutation can expose weak properties while PBT can generate cases that kill mutants.<\/p>\n"}, {"id": "l06-random-025", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q25 — Branch coverage vs mutation", "prompt": "Does branch coverage subsume mutation testing or vice versa?", "answer": "No. Structural traversal and fault sensitivity are different dimensions. A suite can cover every branch yet fail to kill simple mutants because its assertions are weak; a mutation-focused suite may still omit structurally irrelevant branches. Use both when the risk justifies it.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Does branch coverage subsume mutation testing or vice versa?<\/p>\n", "answer_html": "<p>No. Structural traversal and fault sensitivity are different dimensions. A suite can cover every branch yet fail to kill simple mutants because its assertions are weak; a mutation-focused suite may still omit structurally irrelevant branches. Use both when the risk justifies it.<\/p>\n"}, {"id": "l06-random-026", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q26 — Random vs partition testing", "prompt": "Is random testing better than partition testing?", "answer": "Neither universally. Partition testing is efficient when meaningful risk-based subdomains/boundaries are known. Random testing is simple, scalable, statistically analyzable, and attractive when the space is unstructured or the operational distribution matters. At scale, modestly more random tests can erase small partition advantages in some studies.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Is random testing better than partition testing?<\/p>\n", "answer_html": "<p>Neither universally. Partition testing is efficient when meaningful risk-based subdomains/boundaries are known. Random testing is simple, scalable, statistically analyzable, and attractive when the space is unstructured or the operational distribution matters. At scale, modestly more random tests can erase small partition advantages in some studies.<\/p>\n"}, {"id": "l06-random-027", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q27 — Define fuzz testing", "prompt": "Define fuzzing and distinguish it from generic random testing by input, focus, and oracle.", "answer": "Fuzzing automatically feeds unexpected/malformed or mutated inputs to find robustness/security defects. Inputs are often mutation/coverage-guided rather than independent operational samples; the focus is bug discovery rather than unbiased reliability estimation; common oracles are crashes, hangs, sanitizers, assertions, and coverage signals.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Define fuzzing and distinguish it from generic random testing by input, focus, and oracle.<\/p>\n", "answer_html": "<p>Fuzzing automatically feeds unexpected/malformed or mutated inputs to find robustness/security defects. Inputs are often mutation/coverage-guided rather than independent operational samples; the focus is bug discovery rather than unbiased reliability estimation; common oracles are crashes, hangs, sanitizers, assertions, and coverage signals.<\/p>\n"}, {"id": "l06-random-028", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q28 — Oracle bottleneck", "prompt": "What is the oracle problem and why does it bottleneck random testing?", "answer": "Generating millions of inputs is cheap; knowing the correct output for millions of inputs is not. Without an automated oracle, random tests can only reveal obvious crashes/hangs. Strong properties, models, differential implementations, or sanitizers expand what automated random generation can actually detect.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What is the oracle problem and why does it bottleneck random testing?<\/p>\n", "answer_html": "<p>Generating millions of inputs is cheap; knowing the correct output for millions of inputs is not. Without an automated oracle, random tests can only reveal obvious crashes/hangs. Strong properties, models, differential implementations, or sanitizers expand what automated random generation can actually detect.<\/p>\n"}, {"id": "l06-random-029", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q29 — Oracle evolution across four techniques", "prompt": "Trace how the oracle changes from random testing through fuzzing, PBT, and mutation testing.", "answer": "- **Random:** external/reference oracle or simple expected result.\n- **Fuzzing:** often crash/hang/sanitizer oracle; increasingly semantic assertions.\n- **PBT:** executable **properties/invariants** are the oracle.\n- **Mutation:** the existing test suite itself is evaluated as the oracle—does it fail on injected faults?\nThe progression shifts from simple failure signals toward richer semantic/test-quality checks.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Trace how the oracle changes from random testing through fuzzing, PBT, and mutation testing.<\/p>\n", "answer_html": "<ul>\n<li><strong>Random:<\/strong> external/reference oracle or simple expected result.<\/li>\n<li><strong>Fuzzing:<\/strong> often crash/hang/sanitizer oracle; increasingly semantic assertions.<\/li>\n<li><strong>PBT:<\/strong> executable <strong>properties/invariants<\/strong> are the oracle.<\/li>\n<li><strong>Mutation:<\/strong> the existing test suite itself is evaluated as the oracle—does it fail on injected faults?\nThe progression shifts from simple failure signals toward richer semantic/test-quality checks.<\/li>\n<\/ul>\n"}, {"id": "l06-random-030", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q30 — Choose one technique by project context", "prompt": "If limited to one technique, how should the choice vary by project type?", "answer": "Tie the technique to dominant risk: parser/network/security boundary → coverage-guided fuzzing; mathematical/serialization/data-structure library → PBT; mature suite whose adequacy is uncertain → mutation testing; unstructured/stateful domain or reliability sampling → random testing. The justification matters more than a universal winner.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>If limited to one technique, how should the choice vary by project type?<\/p>\n", "answer_html": "<p>Tie the technique to dominant risk: parser/network/security boundary → coverage-guided fuzzing; mathematical/serialization/data-structure library → PBT; mature suite whose adequacy is uncertain → mutation testing; unstructured/stateful domain or reliability sampling → random testing. The justification matters more than a universal winner.<\/p>\n"}, {"id": "l06-random-031", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q31 — Persistent bug classes vs advanced mutant detection", "prompt": "What does the contrast between recurring fuzz bug classes and strong ML mutant detection suggest?", "answer": "Local tool capability can improve dramatically while organizational/systemic defect causes persist. Better analysis does not automatically change unsafe APIs, incentives, review practice, legacy code, or deployment pressure. Reliability requires both advanced detection **and** prevention/process feedback.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>What does the contrast between recurring fuzz bug classes and strong ML mutant detection suggest?<\/p>\n", "answer_html": "<p>Local tool capability can improve dramatically while organizational/systemic defect causes persist. Better analysis does not automatically change unsafe APIs, incentives, review practice, legacy code, or deployment pressure. Reliability requires both advanced detection <strong>and<\/strong> prevention/process feedback.<\/p>\n"}, {"id": "l06-random-032", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q32 — Testing strategy for a JSON parser", "prompt": "Combine random testing, fuzzing, PBT, and mutation testing for a JSON parser.", "answer": "- Random: sample valid/invalid JSON across size/depth distributions.\n- Fuzz: seed with corpus, mutate bytes/tokens, use coverage + ASan/UBSan, dictionary for JSON syntax.\n- PBT: generate ASTs; property `parse(serialize(ast)) == ast`; metamorphic whitespace/key-order cases.\n- Mutation: mutate parser conditions/operators and ensure the suite kills them.\nPersist every discovered failure as regression input.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Combine random testing, fuzzing, PBT, and mutation testing for a JSON parser.<\/p>\n", "answer_html": "<ul>\n<li>Random: sample valid/invalid JSON across size/depth distributions.<\/li>\n<li>Fuzz: seed with corpus, mutate bytes/tokens, use coverage + ASan/UBSan, dictionary for JSON syntax.<\/li>\n<li>PBT: generate ASTs; property <code>parse(serialize(ast)) == ast<\/code>; metamorphic whitespace/key-order cases.<\/li>\n<li>Mutation: mutate parser conditions/operators and ensure the suite kills them.\nPersist every discovered failure as regression input.<\/li>\n<\/ul>\n"}, {"id": "l06-random-033", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q33 — Why JQF-style convergence matters", "prompt": "Why is convergence of PBT and coverage-guided fuzzing significant?", "answer": "PBT provides **structured valid generators and semantic properties** but random search wastes executions; fuzzing provides **coverage-guided search** but raw byte mutation struggles with structured input. Combining them keeps valid structured inputs while steering toward new behavior, addressing central weaknesses of both.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>Why is convergence of PBT and coverage-guided fuzzing significant?<\/p>\n", "answer_html": "<p>PBT provides <strong>structured valid generators and semantic properties<\/strong> but random search wastes executions; fuzzing provides <strong>coverage-guided search<\/strong> but raw byte mutation struggles with structured input. Combining them keeps valid structured inputs while steering toward new behavior, addressing central weaknesses of both.<\/p>\n"}, {"id": "l06-random-034", "topic": "L06 — Random Testing", "section": "L06 — Random Testing", "label": "Q34 — Pesticide paradox across techniques", "prompt": "How does the pesticide paradox apply to random, fuzz, PBT, and mutation testing?", "answer": "Repeatedly using the same distributions, seeds, properties, or mutation operators eventually stops finding new defects because the program/test suite adapts or the search saturates. Universal mitigation: **diversify and refresh**—new seeds/distributions/properties/operators/tools, feedback from production, and regression plus exploration.", "answer_kind": "answer / self-check", "source_path": "L06_Random.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L06_Random.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L06_Random.md", "prompt_html": "<p>How does the pesticide paradox apply to random, fuzz, PBT, and mutation testing?<\/p>\n", "answer_html": "<p>Repeatedly using the same distributions, seeds, properties, or mutation operators eventually stops finding new defects because the program/test suite adapts or the search saturates. Universal mitigation: <strong>diversify and refresh<\/strong>—new seeds/distributions/properties/operators/tools, feedback from production, and regression plus exploration.<\/p>\n"}, {"id": "l07-exploratory-op-001", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q1 — Exploratory testing vs operational-profile testing", "prompt": "State the fundamental difference between ET and operational-profile-based testing.", "answer": "**Exploratory testing (ET)** is human, adaptive, qualitative discovery: learning, design, and execution happen together. **Operational-profile (OP) testing** is quantitative: test frequency is allocated according to measured/estimated real usage probabilities, mainly to assess reliability where users spend time.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>State the fundamental difference between ET and operational-profile-based testing.<\/p>\n", "answer_html": "<p><strong>Exploratory testing (ET)<\/strong> is human, adaptive, qualitative discovery: learning, design, and execution happen together. <strong>Operational-profile (OP) testing<\/strong> is quantitative: test frequency is allocated according to measured/estimated real usage probabilities, mainly to assess reliability where users spend time.<\/p>\n"}, {"id": "l07-exploratory-op-002", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q2 — Why scripted + exploratory improves coverage", "prompt": "What complementary defect classes do scripted and exploratory testing target?", "answer": "Scripted tests systematically verify known requirements/regressions and provide repeatability. ET follows observations and heuristics to find unanticipated interactions, usability issues, and edge cases. Combining them covers **known expected behavior + emergent unknown behavior**; “coverage” here is broader than line coverage.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>What complementary defect classes do scripted and exploratory testing target?<\/p>\n", "answer_html": "<p>Scripted tests systematically verify known requirements/regressions and provide repeatability. ET follows observations and heuristics to find unanticipated interactions, usability issues, and edge cases. Combining them covers <strong>known expected behavior + emergent unknown behavior<\/strong>; “coverage” here is broader than line coverage.<\/p>\n"}, {"id": "l07-exploratory-op-003", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q3 — ET vs ad-hoc testing", "prompt": "How is exploratory testing different from unstructured ad-hoc testing?", "answer": "ET is structured by **charters, heuristics, time-boxed sessions, notes/results, and debriefing**. Test design is adaptive, but accountable. Ad-hoc testing lacks an explicit mission/process and is harder to reproduce, review, or manage.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>How is exploratory testing different from unstructured ad-hoc testing?<\/p>\n", "answer_html": "<p>ET is structured by <strong>charters, heuristics, time-boxed sessions, notes/results, and debriefing<\/strong>. Test design is adaptive, but accountable. Ad-hoc testing lacks an explicit mission/process and is harder to reproduce, review, or manage.<\/p>\n"}, {"id": "l07-exploratory-op-004", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q4 — Coupon-system ET exa
