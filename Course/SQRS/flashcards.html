</main><script>
const cards=[{"id": "l01-quality-models-001", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q1 — Garvin: user vs manufacturing quality", "prompt": "Contrast Garvin's user-based and manufacturing-based views. Give a software example where they judge the same product differently.", "answer": "- **User-based:** quality = fitness for the user's purpose / satisfaction.\n- **Manufacturing-based:** quality = conformance to specification and process; defects are deviations.\n- Example: an app can conform perfectly to its specification yet frustrate users; manufacturing quality is high while user-based quality is low.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Contrast Garvin's user-based and manufacturing-based views. Give a software example where they judge the same product differently.<\/p>\n", "answer_html": "<ul>\n<li><strong>User-based:<\/strong> quality = fitness for the user's purpose / satisfaction.<\/li>\n<li><strong>Manufacturing-based:<\/strong> quality = conformance to specification and process; defects are deviations.<\/li>\n<li>Example: an app can conform perfectly to its specification yet frustrate users; manufacturing quality is high while user-based quality is low.<\/li>\n<\/ul>\n"}, {"id": "l01-quality-models-002", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q2 — Garvin views in development methods", "prompt": "Choose Scrum, XP, RUP, or FDA-style Waterfall and identify the Garvin view that tends to dominate. Justify it.", "answer": "A defensible mapping is enough if justified. Typical examples:\n- **Scrum / XP:** user-based dominates because feedback and delivered value drive acceptance.\n- **FDA-validated Waterfall:** manufacturing-based dominates because documented conformance and traceability are central.\n- **RUP:** often blends product/manufacturing views through architecture, artifacts, and disciplined process.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Choose Scrum, XP, RUP, or FDA-style Waterfall and identify the Garvin view that tends to dominate. Justify it.<\/p>\n", "answer_html": "<p>A defensible mapping is enough if justified. Typical examples:<\/p>\n<ul>\n<li><strong>Scrum / XP:<\/strong> user-based dominates because feedback and delivered value drive acceptance.<\/li>\n<li><strong>FDA-validated Waterfall:<\/strong> manufacturing-based dominates because documented conformance and traceability are central.<\/li>\n<li><strong>RUP:<\/strong> often blends product/manufacturing views through architecture, artifacts, and disciplined process.<\/li>\n<\/ul>\n"}, {"id": "l01-quality-models-003", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q3 — McCall's factor–criteria–metric hierarchy", "prompt": "Explain McCall's three levels and illustrate them with Maintainability.", "answer": "- **Factor:** external quality goal visible to stakeholders, e.g. Maintainability.\n- **Criteria:** internal properties that influence factors, e.g. simplicity/modularity/conciseness.\n- **Metrics:** measurements of criteria, e.g. cyclomatic complexity, coupling, LOC.\n- The model links measurable internals → criteria → stakeholder-facing quality factors.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Explain McCall's three levels and illustrate them with Maintainability.<\/p>\n", "answer_html": "<ul>\n<li><strong>Factor:<\/strong> external quality goal visible to stakeholders, e.g. Maintainability.<\/li>\n<li><strong>Criteria:<\/strong> internal properties that influence factors, e.g. simplicity/modularity/conciseness.<\/li>\n<li><strong>Metrics:<\/strong> measurements of criteria, e.g. cyclomatic complexity, coupling, LOC.<\/li>\n<li>The model links measurable internals → criteria → stakeholder-facing quality factors.<\/li>\n<\/ul>\n"}, {"id": "l01-quality-models-004", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q4 — McCall's three categories", "prompt": "Pick one McCall category, list its factors, and explain them for a mobile banking app.", "answer": "Know the factor sets:\n- **Product Operation:** correctness, reliability, efficiency, integrity, usability.\n- **Product Revision:** maintainability, flexibility, testability.\n- **Product Transition:** portability, reusability, interoperability.\nThen translate each selected factor into a banking-app example.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Pick one McCall category, list its factors, and explain them for a mobile banking app.<\/p>\n", "answer_html": "<p>Know the factor sets:<\/p>\n<ul>\n<li><strong>Product Operation:<\/strong> correctness, reliability, efficiency, integrity, usability.<\/li>\n<li><strong>Product Revision:<\/strong> maintainability, flexibility, testability.<\/li>\n<li><strong>Product Transition:<\/strong> portability, reusability, interoperability.\nThen translate each selected factor into a banking-app example.<\/li>\n<\/ul>\n"}, {"id": "l01-quality-models-005", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q5 — Quality-attribute trade-offs", "prompt": "Explain one Perry inverse relationship: Integrity–Efficiency, Usability–Efficiency, or Flexibility–Integrity.", "answer": "Trade-offs mean improving one attribute can impose cost on another. Examples: encryption/access checks improve **integrity** but add CPU/latency; richer UI improves **usability** but consumes resources; highly configurable extension points improve **flexibility** but enlarge the attack surface. State the mechanism, not just the pair.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Explain one Perry inverse relationship: Integrity–Efficiency, Usability–Efficiency, or Flexibility–Integrity.<\/p>\n", "answer_html": "<p>Trade-offs mean improving one attribute can impose cost on another. Examples: encryption/access checks improve <strong>integrity<\/strong> but add CPU/latency; richer UI improves <strong>usability<\/strong> but consumes resources; highly configurable extension points improve <strong>flexibility<\/strong> but enlarge the attack surface. State the mechanism, not just the pair.<\/p>\n"}, {"id": "l01-quality-models-006", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q6 — ISO 25010: security, reliability, maintainability", "prompt": "Define Security, Reliability, and Maintainability and give one testable requirement for each.", "answer": "- **Security:** protection against unauthorized access/manipulation. Example: 100% of privileged endpoints require authenticated RBAC.\n- **Reliability:** continued correct service under stated conditions. Example: monthly availability ≥99.9%.\n- **Maintainability:** ease/effectiveness of analysis, modification, and testing. Example: a supported change class can be implemented and regression-tested within an agreed threshold.\nGood requirements include condition, component, attribute, threshold, and measurement.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Define Security, Reliability, and Maintainability and give one testable requirement for each.<\/p>\n", "answer_html": "<ul>\n<li><strong>Security:<\/strong> protection against unauthorized access/manipulation. Example: 100% of privileged endpoints require authenticated RBAC.<\/li>\n<li><strong>Reliability:<\/strong> continued correct service under stated conditions. Example: monthly availability ≥99.9%.<\/li>\n<li><strong>Maintainability:<\/strong> ease/effectiveness of analysis, modification, and testing. Example: a supported change class can be implemented and regression-tested within an agreed threshold.\nGood requirements include condition, component, attribute, threshold, and measurement.<\/li>\n<\/ul>\n"}, {"id": "l01-quality-models-007", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q7 — Firesmith's six-step quality-requirement process", "prompt": "Apply the six-step process to a fast search API.", "answer": "1. Determine relevant quality characteristics.\n2. Consider system/use context.\n3. Define quality criteria.\n4. Select measures.\n5. Specify a threshold requirement.\n6. Evaluate testability, feasibility, and completeness.\nExample result: under normal load (<1000 concurrent users), search p95 latency shall be <200 ms.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Apply the six-step process to a fast search API.<\/p>\n", "answer_html": "<ol>\n<li>Determine relevant quality characteristics.<\/li>\n<li>Consider system/use context.<\/li>\n<li>Define quality criteria.<\/li>\n<li>Select measures.<\/li>\n<li>Specify a threshold requirement.<\/li>\n<li>Evaluate testability, feasibility, and completeness.\nExample result: under normal load (&lt;1000 concurrent users), search p95 latency shall be &lt;200 ms.<\/li>\n<\/ol>\n"}, {"id": "l01-quality-models-008", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q8 — Turn vague quality claims into testable requirements", "prompt": "Why is “fast and reliable” poor, and how should it be rewritten?", "answer": "It is ambiguous, combines two attributes, and has no operating condition, threshold, or measurement. Split it. Example:\n- Under normal load, Search API p95 latency shall be <200 ms.\n- During production operation, monthly availability shall be ≥99.9%.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Why is “fast and reliable” poor, and how should it be rewritten?<\/p>\n", "answer_html": "<p>It is ambiguous, combines two attributes, and has no operating condition, threshold, or measurement. Split it. Example:<\/p>\n<ul>\n<li>Under normal load, Search API p95 latency shall be &lt;200 ms.<\/li>\n<li>During production operation, monthly availability shall be ≥99.9%.<\/li>\n<\/ul>\n"}, {"id": "l01-quality-models-009", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q9 — Product Quality vs Quality in Use", "prompt": "Distinguish ISO product quality from quality in use and give a high-product-quality / low-quality-in-use example.", "answer": "- **Product quality:** properties of the software itself (e.g. reliability, maintainability, security).\n- **Quality in use:** whether specific users achieve goals effectively, efficiently, safely, and satisfactorily in context.\n- Example: a reliable, maintainable tax tool can still have confusing workflows that cause users to file incorrectly.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Distinguish ISO product quality from quality in use and give a high-product-quality / low-quality-in-use example.<\/p>\n", "answer_html": "<ul>\n<li><strong>Product quality:<\/strong> properties of the software itself (e.g. reliability, maintainability, security).<\/li>\n<li><strong>Quality in use:<\/strong> whether specific users achieve goals effectively, efficiently, safely, and satisfactorily in context.<\/li>\n<li>Example: a reliable, maintainable tax tool can still have confusing workflows that cause users to file incorrectly.<\/li>\n<\/ul>\n"}, {"id": "l01-quality-models-010", "topic": "L01 — Quality Models", "section": "L01 — Quality Models", "label": "Q10 — Kano: must-haves vs delighters", "prompt": "Explain Kano must-have attributes and delighters; give two streaming-app examples of each.", "answer": "- **Must-haves:** expected basics; absence causes strong dissatisfaction, presence earns little extra praise. E.g. playback works; billing/account access is correct.\n- **Delighters:** unexpected benefits; absence is tolerated, presence raises satisfaction. E.g. excellent automatic highlights; unusually smart cross-device recommendations.\nAs markets mature, delighters can become performance attributes and eventually must-haves.", "answer_kind": "answer / self-check", "source_path": "L01_Quality_Models.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ-L1-QM.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L01_Quality_Models.md", "prompt_html": "<p>Explain Kano must-have attributes and delighters; give two streaming-app examples of each.<\/p>\n", "answer_html": "<ul>\n<li><strong>Must-haves:<\/strong> expected basics; absence causes strong dissatisfaction, presence earns little extra praise. E.g. playback works; billing/account access is correct.<\/li>\n<li><strong>Delighters:<\/strong> unexpected benefits; absence is tolerated, presence raises satisfaction. E.g. excellent automatic highlights; unusually smart cross-device recommendations.\nAs markets mature, delighters can become performance attributes and eventually must-haves.<\/li>\n<\/ul>\n"}, {"id": "l02-metrics-001", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q1 — Hubbard measurement vs transcendent quality", "prompt": "State Hubbard's definition of measurement and contrast it with Garvin's transcendent view.", "answer": "Hubbard: **measurement is a quantitatively expressed reduction of uncertainty based on one or more observations**. Garvin's transcendent view treats quality as recognizable excellence that is hard to define. Hubbard challenges that stance: useful measurement need not be perfect; even partial quantitative evidence can reduce uncertainty.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>State Hubbard's definition of measurement and contrast it with Garvin's transcendent view.<\/p>\n", "answer_html": "<p>Hubbard: <strong>measurement is a quantitatively expressed reduction of uncertainty based on one or more observations<\/strong>. Garvin's transcendent view treats quality as recognizable excellence that is hard to define. Hubbard challenges that stance: useful measurement need not be perfect; even partial quantitative evidence can reduce uncertainty.<\/p>\n"}, {"id": "l02-metrics-002", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q2 — Resolution, accuracy, precision", "prompt": "Define resolution, accuracy, and precision. A tool always reports CC=10 while the correct value is 12—what is it?", "answer": "- **Resolution:** smallest change the measurement can distinguish.\n- **Accuracy:** closeness to the true/reference value.\n- **Precision:** repeatability/consistency.\nThe tool is **precise but inaccurate** if it repeatedly reports 10.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Define resolution, accuracy, and precision. A tool always reports CC=10 while the correct value is 12—what is it?<\/p>\n", "answer_html": "<ul>\n<li><strong>Resolution:<\/strong> smallest change the measurement can distinguish.<\/li>\n<li><strong>Accuracy:<\/strong> closeness to the true/reference value.<\/li>\n<li><strong>Precision:<\/strong> repeatability/consistency.\nThe tool is <strong>precise but inaccurate<\/strong> if it repeatedly reports 10.<\/li>\n<\/ul>\n"}, {"id": "l02-metrics-003", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q3 — Three metric dangers", "prompt": "Analyze an 80% coverage mandate that produces 85% coverage but no defect reduction using bad statistics, bad decisions, and bad incentives.", "answer": "- **Bad statistics:** coverage is treated as a direct proxy for effectiveness.\n- **Bad decisions:** the organization optimizes the proxy instead of defect risk / assertions / requirements.\n- **Bad incentives:** developers write tests only to cross the threshold (Goodhart-like gaming).\nA metric should inform a goal, not become the goal.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Analyze an 80% coverage mandate that produces 85% coverage but no defect reduction using bad statistics, bad decisions, and bad incentives.<\/p>\n", "answer_html": "<ul>\n<li><strong>Bad statistics:<\/strong> coverage is treated as a direct proxy for effectiveness.<\/li>\n<li><strong>Bad decisions:<\/strong> the organization optimizes the proxy instead of defect risk / assertions / requirements.<\/li>\n<li><strong>Bad incentives:<\/strong> developers write tests only to cross the threshold (Goodhart-like gaming).\nA metric should inform a goal, not become the goal.<\/li>\n<\/ul>\n"}, {"id": "l02-metrics-004", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q4 — McNamara fallacy and streetlight effect", "prompt": "A manager promotes the developer with more commits/LOC/closed bugs while ignoring mentoring, architecture, and debt reduction. Which fallacies apply?", "answer": "**Both can apply.** McNamara: decisions use only what is easily quantified and effectively assign zero value to hard-to-measure contributions. Streetlight effect: the manager measures what tools conveniently expose instead of what best represents performance/value.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>A manager promotes the developer with more commits/LOC/closed bugs while ignoring mentoring, architecture, and debt reduction. Which fallacies apply?<\/p>\n", "answer_html": "<p><strong>Both can apply.<\/strong> McNamara: decisions use only what is easily quantified and effectively assign zero value to hard-to-measure contributions. Streetlight effect: the manager measures what tools conveniently expose instead of what best represents performance/value.<\/p>\n"}, {"id": "l02-metrics-005", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q5 — NOIR scales", "prompt": "Explain Nominal, Ordinal, Interval, and Ratio scales with software examples.", "answer": "- **Nominal:** categories only; e.g. defect type.\n- **Ordinal:** ordered categories; e.g. severity Low/Medium/High.\n- **Interval:** equal differences, no true zero; classic example temperature °C (software examples are rarer).\n- **Ratio:** equal intervals + true zero; e.g. LOC, elapsed time, defect count.\nOnly use operations meaningful for the scale.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Explain Nominal, Ordinal, Interval, and Ratio scales with software examples.<\/p>\n", "answer_html": "<ul>\n<li><strong>Nominal:<\/strong> categories only; e.g. defect type.<\/li>\n<li><strong>Ordinal:<\/strong> ordered categories; e.g. severity Low/Medium/High.<\/li>\n<li><strong>Interval:<\/strong> equal differences, no true zero; classic example temperature °C (software examples are rarer).<\/li>\n<li><strong>Ratio:<\/strong> equal intervals + true zero; e.g. LOC, elapsed time, defect count.\nOnly use operations meaningful for the scale.<\/li>\n<\/ul>\n"}, {"id": "l02-metrics-006", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q6 — Mean vs median", "prompt": "When should mean vs median be used? For nine 1-hour fixes and one 100-hour fix, calculate both.", "answer": "Mean is useful for roughly symmetric quantitative data; median is robust for skew/outlier-heavy data. Mean = (9×1+100)/10 = **10.9 h**. Median = **1 h**, which better represents the typical fix in this sample.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>When should mean vs median be used? For nine 1-hour fixes and one 100-hour fix, calculate both.<\/p>\n", "answer_html": "<p>Mean is useful for roughly symmetric quantitative data; median is robust for skew/outlier-heavy data. Mean = (9×1+100)/10 = <strong>10.9 h<\/strong>. Median = <strong>1 h<\/strong>, which better represents the typical fix in this sample.<\/p>\n"}, {"id": "l02-metrics-007", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q7 — Confounding variables", "prompt": "Define a confounder and explain the class-size confounding result in OO metrics research.", "answer": "A confounder affects both the proposed predictor and the outcome, creating/magnifying an apparent relationship. Large classes tend to have higher OO metric values **and** more defects. After controlling for class size, many metric–defect associations shrink; the lecture notes that only **4 of 24** commonly used OO metrics remained useful in that study.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Define a confounder and explain the class-size confounding result in OO metrics research.<\/p>\n", "answer_html": "<p>A confounder affects both the proposed predictor and the outcome, creating/magnifying an apparent relationship. Large classes tend to have higher OO metric values <strong>and<\/strong> more defects. After controlling for class size, many metric–defect associations shrink; the lecture notes that only <strong>4 of 24<\/strong> commonly used OO metrics remained useful in that study.<\/p>\n"}, {"id": "l02-metrics-008", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q8 — Goal–Question–Metric (GQM)", "prompt": "Apply GQM to “Improve maintainability of the codebase.”", "answer": "Example:\n- **Goal:** improve maintainability for the development team in the current maintenance context.\n- **Questions:** Which modules are hard to understand/change? Where is coupling/complexity concentrated? How long do changes take?\n- **Metrics:** cyclomatic complexity, coupling, change lead time, defect escape after changes, review/rework rates.\nMetrics must answer the questions that operationalize the goal.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Apply GQM to “Improve maintainability of the codebase.”<\/p>\n", "answer_html": "<p>Example:<\/p>\n<ul>\n<li><strong>Goal:<\/strong> improve maintainability for the development team in the current maintenance context.<\/li>\n<li><strong>Questions:<\/strong> Which modules are hard to understand/change? Where is coupling/complexity concentrated? How long do changes take?<\/li>\n<li><strong>Metrics:<\/strong> cyclomatic complexity, coupling, change lead time, defect escape after changes, review/rework rates.\nMetrics must answer the questions that operationalize the goal.<\/li>\n<\/ul>\n"}, {"id": "l02-metrics-009", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q9 — Maintainability Index", "prompt": "Explain MI = 171 − 5.2 ln(HV) − 0.23 CC − 16.2 ln(LOC), its inputs, and limitations.", "answer": "HV = Halstead Volume, CC = cyclomatic complexity, LOC = size. Higher complexity/volume/size reduce the index. MI is useful as a comparative indicator, not ground truth: variants differ by tool, it mixes correlated size/complexity measures, thresholds are context-dependent, and a single score hides causes.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Explain MI = 171 − 5.2 ln(HV) − 0.23 CC − 16.2 ln(LOC), its inputs, and limitations.<\/p>\n", "answer_html": "<p>HV = Halstead Volume, CC = cyclomatic complexity, LOC = size. Higher complexity/volume/size reduce the index. MI is useful as a comparative indicator, not ground truth: variants differ by tool, it mixes correlated size/complexity measures, thresholds are context-dependent, and a single score hides causes.<\/p>\n"}, {"id": "l02-metrics-010", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q10 — CK object-oriented metrics", "prompt": "Name five CK metrics and explain what a high value suggests.", "answer": "Canonical CK metrics include **WMC** (many/complex methods), **DIT** (deep inheritance), **NOC** (many children), **CBO** (high coupling), **RFC** (large response set), and **LCOM** (low cohesion when high). The question asks for five; know at least five plus the direction/interpretation.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Name five CK metrics and explain what a high value suggests.<\/p>\n", "answer_html": "<p>Canonical CK metrics include <strong>WMC<\/strong> (many/complex methods), <strong>DIT<\/strong> (deep inheritance), <strong>NOC<\/strong> (many children), <strong>CBO<\/strong> (high coupling), <strong>RFC<\/strong> (large response set), and <strong>LCOM<\/strong> (low cohesion when high). The question asks for five; know at least five plus the direction/interpretation.<\/p>\n"}, {"id": "l02-metrics-011", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q11 — Operational definitions", "prompt": "Before comparing 15 vs 8 defects/KLOC, what must be operationally defined?", "answer": "Ensure **communication** and **repeatability**. Define what counts as a defect (severity, duplicate handling, source), when it is counted (opened/confirmed/fixed), what code is in KLOC (generated/tests/comments?), counting method (physical/logical LOC), time window, and product/version. Otherwise the rates are not comparable.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Before comparing 15 vs 8 defects/KLOC, what must be operationally defined?<\/p>\n", "answer_html": "<p>Ensure <strong>communication<\/strong> and <strong>repeatability<\/strong>. Define what counts as a defect (severity, duplicate handling, source), when it is counted (opened/confirmed/fixed), what code is in KLOC (generated/tests/comments?), counting method (physical/logical LOC), time window, and product/version. Otherwise the rates are not comparable.<\/p>\n"}, {"id": "l02-metrics-012", "topic": "L02 — Quality Measurement & Metrics", "section": "L02 — Quality Measurement & Metrics", "label": "Q12 — From quality model to measure", "prompt": "Explain Characteristic → Sub-characteristic → Measure with a maintainability example.", "answer": "Example: **Maintainability** → **Analyzability/Modifiability/Testability** → concrete measure such as mean change lead time, coupling, complexity, or automated-test execution/coverage relevant to that sub-characteristic. The hierarchy turns a broad quality concept into observable evidence.", "answer_kind": "answer / self-check", "source_path": "L02_Metrics.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L2_Metrics.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L02_Metrics.md", "prompt_html": "<p>Explain Characteristic → Sub-characteristic → Measure with a maintainability example.<\/p>\n", "answer_html": "<p>Example: <strong>Maintainability<\/strong> → <strong>Analyzability/Modifiability/Testability<\/strong> → concrete measure such as mean change lead time, coupling, complexity, or automated-test execution/coverage relevant to that sub-characteristic. The hierarchy turns a broad quality concept into observable evidence.<\/p>\n"}, {"id": "l03-verification-001", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q1 — Four verification techniques", "prompt": "List the four INCOSE-style verification techniques, define each, and give a suitable use.", "answer": "- **Inspection:** examine an artifact without executing it; e.g. requirements/design review.\n- **Analysis:** use models/calculations/static reasoning; e.g. timing or static-analysis proof.\n- **Demonstration:** operate the item and observe behavior, usually without precise instrumentation; e.g. show an installation/workflow.\n- **Test:** execute under controlled conditions and compare measured outputs to expected results.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>List the four INCOSE-style verification techniques, define each, and give a suitable use.<\/p>\n", "answer_html": "<ul>\n<li><strong>Inspection:<\/strong> examine an artifact without executing it; e.g. requirements/design review.<\/li>\n<li><strong>Analysis:<\/strong> use models/calculations/static reasoning; e.g. timing or static-analysis proof.<\/li>\n<li><strong>Demonstration:<\/strong> operate the item and observe behavior, usually without precise instrumentation; e.g. show an installation/workflow.<\/li>\n<li><strong>Test:<\/strong> execute under controlled conditions and compare measured outputs to expected results.<\/li>\n<\/ul>\n"}, {"id": "l03-verification-002", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q2 — Inspection formality spectrum", "prompt": "Order four inspection/review techniques from formal to informal and state when each fits.", "answer": "A defensible order: **Fagan inspection → formal technical/peer review → walkthrough → desk check/ad-hoc review**. Formal inspections fit high-risk or regulated artifacts; walkthroughs are useful for shared understanding; informal review is cheap for low-risk/local changes.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Order four inspection/review techniques from formal to informal and state when each fits.<\/p>\n", "answer_html": "<p>A defensible order: <strong>Fagan inspection → formal technical/peer review → walkthrough → desk check/ad-hoc review<\/strong>. Formal inspections fit high-risk or regulated artifacts; walkthroughs are useful for shared understanding; informal review is cheap for low-risk/local changes.<\/p>\n"}, {"id": "l03-verification-003", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q3 — Inspection vs testing", "prompt": "Compare inspection and testing across at least three dimensions and explain why they complement each other.", "answer": "Inspection is **static**, can start before executable code, and is strong for omissions, standards, maintainability, and design defects. Testing is **dynamic**, requires executable behavior, and exposes runtime failures, interactions, timing, and environment effects. They overlap but find different defect classes; defense in depth reduces blind spots.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Compare inspection and testing across at least three dimensions and explain why they complement each other.<\/p>\n", "answer_html": "<p>Inspection is <strong>static<\/strong>, can start before executable code, and is strong for omissions, standards, maintainability, and design defects. Testing is <strong>dynamic<\/strong>, requires executable behavior, and exposes runtime failures, interactions, timing, and environment effects. They overlap but find different defect classes; defense in depth reduces blind spots.<\/p>\n"}, {"id": "l03-verification-004", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q4 — Safety vs liveness properties", "prompt": "Define safety and liveness properties with examples.", "answer": "- **Safety:** “something bad never happens.” Example: a balance never becomes negative without an authorized overdraft.\n- **Liveness:** “something good eventually happens.” Example: every accepted job eventually completes or reaches a terminal failure state.\nSafety violations have finite bad prefixes; liveness concerns progress/eventuality.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Define safety and liveness properties with examples.<\/p>\n", "answer_html": "<ul>\n<li><strong>Safety:<\/strong> “something bad never happens.” Example: a balance never becomes negative without an authorized overdraft.<\/li>\n<li><strong>Liveness:<\/strong> “something good eventually happens.” Example: every accepted job eventually completes or reaches a terminal failure state.\nSafety violations have finite bad prefixes; liveness concerns progress/eventuality.<\/li>\n<\/ul>\n"}, {"id": "l03-verification-005", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q5 — Soundness, completeness, Rice's theorem", "prompt": "Explain the soundness/completeness trade-off in static analysis and the implication of Rice's theorem.", "answer": "- **Sound** (for a property): no real violations are missed, often at the cost of false positives.\n- **Complete/precise** in practice: avoids false alarms, but may miss real defects.\nRice's theorem says non-trivial semantic program properties are undecidable in general, so practical tools approximate. Commercial tools choose a usable point on the false-positive/false-negative trade-off.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Explain the soundness/completeness trade-off in static analysis and the implication of Rice's theorem.<\/p>\n", "answer_html": "<ul>\n<li><strong>Sound<\/strong> (for a property): no real violations are missed, often at the cost of false positives.<\/li>\n<li><strong>Complete/precise<\/strong> in practice: avoids false alarms, but may miss real defects.\nRice's theorem says non-trivial semantic program properties are undecidable in general, so practical tools approximate. Commercial tools choose a usable point on the false-positive/false-negative trade-off.<\/li>\n<\/ul>\n"}, {"id": "l03-verification-006", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q6 — Four test levels", "prompt": "Describe unit, integration, system, and acceptance testing: object, typical performer, and example defect.", "answer": "- **Unit:** single function/class/component; developers; local logic defect.\n- **Integration:** component interfaces; developers/testers; contract/protocol mismatch.\n- **System:** complete system in representative environment; test team; end-to-end behavior/configuration failure.\n- **Acceptance:** business/user needs; customer/product stakeholders; requirement/fitness-for-use gap.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Describe unit, integration, system, and acceptance testing: object, typical performer, and example defect.<\/p>\n", "answer_html": "<ul>\n<li><strong>Unit:<\/strong> single function/class/component; developers; local logic defect.<\/li>\n<li><strong>Integration:<\/strong> component interfaces; developers/testers; contract/protocol mismatch.<\/li>\n<li><strong>System:<\/strong> complete system in representative environment; test team; end-to-end behavior/configuration failure.<\/li>\n<li><strong>Acceptance:<\/strong> business/user needs; customer/product stakeholders; requirement/fitness-for-use gap.<\/li>\n<\/ul>\n"}, {"id": "l03-verification-007", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q7 — Mocks and test doubles", "prompt": "What role do mocks play in unit testing?", "answer": "Mocks replace collaborators so the unit is isolated and tests are deterministic/fast. They can supply controlled responses and verify interactions (calls, arguments, ordering). Over-mocking couples tests to implementation details, so mock boundaries rather than every internal object.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>What role do mocks play in unit testing?<\/p>\n", "answer_html": "<p>Mocks replace collaborators so the unit is isolated and tests are deterministic/fast. They can supply controlled responses and verify interactions (calls, arguments, ordering). Over-mocking couples tests to implementation details, so mock boundaries rather than every internal object.<\/p>\n"}, {"id": "l03-verification-008", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q8 — Black-box vs white-box testing", "prompt": "Compare required knowledge, defect focus, and a technique for black-box and white-box testing.", "answer": "- **Black-box:** uses specification/interface, not implementation; targets missing/incorrect behavior and input-domain faults; techniques include EP, BVA, decision tables.\n- **White-box:** uses code/control/data structure; targets unexecuted branches, path/condition/data-flow issues; techniques include statement/branch/MC/DC coverage.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Compare required knowledge, defect focus, and a technique for black-box and white-box testing.<\/p>\n", "answer_html": "<ul>\n<li><strong>Black-box:<\/strong> uses specification/interface, not implementation; targets missing/incorrect behavior and input-domain faults; techniques include EP, BVA, decision tables.<\/li>\n<li><strong>White-box:<\/strong> uses code/control/data structure; targets unexecuted branches, path/condition/data-flow issues; techniques include statement/branch/MC/DC coverage.<\/li>\n<\/ul>\n"}, {"id": "l03-verification-009", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q9 — Google-style test pyramid", "prompt": "Explain the 70/20/10 pyramid and the ice-cream-cone anti-pattern.", "answer": "Typical ratio: about **70% unit/small**, **20% integration/service**, **10% end-to-end/UI**. Lower-level tests are faster, more deterministic, and easier to diagnose; a small number of E2E tests protects critical flows. The **ice-cream cone** reverses this with many slow/brittle UI tests and too little fast unit coverage.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Explain the 70/20/10 pyramid and the ice-cream-cone anti-pattern.<\/p>\n", "answer_html": "<p>Typical ratio: about <strong>70% unit/small<\/strong>, <strong>20% integration/service<\/strong>, <strong>10% end-to-end/UI<\/strong>. Lower-level tests are faster, more deterministic, and easier to diagnose; a small number of E2E tests protects critical flows. The <strong>ice-cream cone<\/strong> reverses this with many slow/brittle UI tests and too little fast unit coverage.<\/p>\n"}, {"id": "l03-verification-010", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q10 — Demonstration as verification", "prompt": "Define demonstration and when it is the appropriate verification method; give two examples.", "answer": "Demonstration verifies a requirement by **operating the system and observing that a capability is present**, when pass/fail can be established by observation rather than precise measurement. Examples: demonstrate successful installation/uninstallation; demonstrate a user workflow or failover procedure. If numerical limits must be measured, that is a test/analysis rather than mere demonstration.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Define demonstration and when it is the appropriate verification method; give two examples.<\/p>\n", "answer_html": "<p>Demonstration verifies a requirement by <strong>operating the system and observing that a capability is present<\/strong>, when pass/fail can be established by observation rather than precise measurement. Examples: demonstrate successful installation/uninstallation; demonstrate a user workflow or failover procedure. If numerical limits must be measured, that is a test/analysis rather than mere demonstration.<\/p>\n"}, {"id": "l03-verification-011", "topic": "L03 — Verification Methods", "section": "L03 — Verification Methods", "label": "Q11 — Verification defense in depth", "prompt": "Select effective verification techniques for maintainability, usability, and security.", "answer": "- **Maintainability:** inspection/design review + static analysis/code metrics; targeted tests for changeability.\n- **Usability:** demonstration/validation with representative users and task-based testing.\n- **Security:** combine threat/design inspection, SAST/static analysis, dynamic/penetration/fuzz testing, and dependency analysis.\nNo single technique covers all attributes.", "answer_kind": "answer / self-check", "source_path": "L03_Verification.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L03_Verification.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L03_Verification.md", "prompt_html": "<p>Select effective verification techniques for maintainability, usability, and security.<\/p>\n", "answer_html": "<ul>\n<li><strong>Maintainability:<\/strong> inspection/design review + static analysis/code metrics; targeted tests for changeability.<\/li>\n<li><strong>Usability:<\/strong> demonstration/validation with representative users and task-based testing.<\/li>\n<li><strong>Security:<\/strong> combine threat/design inspection, SAST/static analysis, dynamic/penetration/fuzz testing, and dependency analysis.\nNo single technique covers all attributes.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-001", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q1 — Coverage categories", "prompt": "Match white-box, black-box, mutation, and requirements coverage to their focus.", "answer": "- **White-box → code structure**.\n- **Black-box → input/specification space**.\n- **Mutation → fault-detection strength**.\n- **Requirements/state coverage → specification/required behavior**.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Match white-box, black-box, mutation, and requirements coverage to their focus.<\/p>\n", "answer_html": "<ul>\n<li><strong>White-box → code structure<\/strong>.<\/li>\n<li><strong>Black-box → input/specification space<\/strong>.<\/li>\n<li><strong>Mutation → fault-detection strength<\/strong>.<\/li>\n<li><strong>Requirements/state coverage → specification/required behavior<\/strong>.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-002", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q2 — Coverage calculation", "prompt": "A suite executes 45 of 60 statements. Compute statement coverage.", "answer": "45/60 × 100% = **75%**.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>A suite executes 45 of 60 statements. Compute statement coverage.<\/p>\n", "answer_html": "<p>45/60 × 100% = <strong>75%<\/strong>.<\/p>\n"}, {"id": "l04-coverage-003", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q3 — Two uses of coverage", "prompt": "What are the two ways a coverage criterion can be used?", "answer": "- **Generator/goal:** design or add tests until a criterion is satisfied.\n- **Measure/diagnostic:** measure an existing suite to find unexercised elements.\nCoverage is most useful as feedback about gaps, not as a claim of correctness.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>What are the two ways a coverage criterion can be used?<\/p>\n", "answer_html": "<ul>\n<li><strong>Generator/goal:<\/strong> design or add tests until a criterion is satisfied.<\/li>\n<li><strong>Measure/diagnostic:<\/strong> measure an existing suite to find unexercised elements.\nCoverage is most useful as feedback about gaps, not as a claim of correctness.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-004", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q4 — Why 100% statement coverage can miss a fault", "prompt": "Explain how a test can execute every statement yet miss division by zero in an if-controlled assignment.", "answer": "Statement coverage does not require every decision outcome. A test taking the true branch can execute the assignment and later division, giving 100% statement coverage, while never taking the false branch where the divisor remains zero. **Branch coverage** forces both outcomes.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Explain how a test can execute every statement yet miss division by zero in an if-controlled assignment.<\/p>\n", "answer_html": "<p>Statement coverage does not require every decision outcome. A test taking the true branch can execute the assignment and later division, giving 100% statement coverage, while never taking the false branch where the divisor remains zero. <strong>Branch coverage<\/strong> forces both outcomes.<\/p>\n"}, {"id": "l04-coverage-005", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q5 — Branch vs statement test count", "prompt": "How many tests are typically needed to cover both outcomes of a simple if-else, and how does that compare with statement coverage?", "answer": "For a binary decision, **2 tests** are needed for 100% branch coverage (true + false). Statement coverage may need only **1** if one path executes all statements relevant to the metric; therefore branch coverage subsumes statement coverage but not vice versa.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>How many tests are typically needed to cover both outcomes of a simple if-else, and how does that compare with statement coverage?<\/p>\n", "answer_html": "<p>For a binary decision, <strong>2 tests<\/strong> are needed for 100% branch coverage (true + false). Statement coverage may need only <strong>1<\/strong> if one path executes all statements relevant to the metric; therefore branch coverage subsumes statement coverage but not vice versa.<\/p>\n"}, {"id": "l04-coverage-006", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q6 — Compound-predicate blind spot", "prompt": "For `A && B`, what case can branch coverage miss and why does it matter?", "answer": "Tests `(T,T)` and `(F,*)` cover true/false decision outcomes, but can miss **A=T, B=F** because short-circuit false can be achieved with A=F. A defect specifically involving B (or AND vs OR) may survive.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>For <code>A &amp;&amp; B<\/code>, what case can branch coverage miss and why does it matter?<\/p>\n", "answer_html": "<p>Tests <code>(T,T)<\/code> and <code>(F,*)<\/code> cover true/false decision outcomes, but can miss <strong>A=T, B=F<\/strong> because short-circuit false can be achieved with A=F. A defect specifically involving B (or AND vs OR) may survive.<\/p>\n"}, {"id": "l04-coverage-007", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q7 — Cyclomatic complexity from graph", "prompt": "A CFG has E=10 edges and N=8 nodes. Compute V(G).", "answer": "V(G)=E−N+2 = 10−8+2 = **4** independent basis paths.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>A CFG has E=10 edges and N=8 nodes. Compute V(G).<\/p>\n", "answer_html": "<p>V(G)=E−N+2 = 10−8+2 = <strong>4<\/strong> independent basis paths.<\/p>\n"}, {"id": "l04-coverage-008", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q8 — Cyclomatic complexity from decisions", "prompt": "A function has five decision points. Compute cyclomatic complexity.", "answer": "For a single connected function, V(G)=D+1 = 5+1 = **6**.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>A function has five decision points. Compute cyclomatic complexity.<\/p>\n", "answer_html": "<p>For a single connected function, V(G)=D+1 = 5+1 = <strong>6<\/strong>.<\/p>\n"}, {"id": "l04-coverage-009", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q9 — Basis path vs all paths", "prompt": "Why use basis-path coverage instead of all paths? Fill the 4- and 10-decision examples.", "answer": "All paths grow exponentially while basis paths grow roughly linearly with decisions.\n- 4 decisions: all paths ≈ **16**, basis paths **5**.\n- 10 decisions: all paths ≈ **1024**, basis paths **11**.\nLoops can make literal all-path coverage infinite.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Why use basis-path coverage instead of all paths? Fill the 4- and 10-decision examples.<\/p>\n", "answer_html": "<p>All paths grow exponentially while basis paths grow roughly linearly with decisions.<\/p>\n<ul>\n<li>4 decisions: all paths ≈ <strong>16<\/strong>, basis paths <strong>5<\/strong>.<\/li>\n<li>10 decisions: all paths ≈ <strong>1024<\/strong>, basis paths <strong>11<\/strong>.\nLoops can make literal all-path coverage infinite.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-010", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q10 — Infeasible paths", "prompt": "Define an infeasible path and give an example.", "answer": "An infeasible path is present in the CFG but cannot occur for any valid execution because of data/semantic constraints. Example: test `x>0`, do not change x, then later require `x<=0`; that path combination cannot happen.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Define an infeasible path and give an example.<\/p>\n", "answer_html": "<p>An infeasible path is present in the CFG but cannot occur for any valid execution because of data/semantic constraints. Example: test <code>x&gt;0<\/code>, do not change x, then later require <code>x&lt;=0<\/code>; that path combination cannot happen.<\/p>\n"}, {"id": "l04-coverage-011", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q11 — Condition-coverage test counts", "prompt": "For `A && B`, compare Basic Condition, Multiple Condition, and MC/DC test counts.", "answer": "Typical minimal sets:\n- **Basic condition:** 2 tests can make each condition T/F (e.g. TT, FF).\n- **Multiple condition:** **4** combinations TT, TF, FT, FF.\n- **MC/DC:** **3** tests, e.g. TT, TF, FT.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>For <code>A &amp;&amp; B<\/code>, compare Basic Condition, Multiple Condition, and MC/DC test counts.<\/p>\n", "answer_html": "<p>Typical minimal sets:<\/p>\n<ul>\n<li><strong>Basic condition:<\/strong> 2 tests can make each condition T/F (e.g. TT, FF).<\/li>\n<li><strong>Multiple condition:<\/strong> <strong>4<\/strong> combinations TT, TF, FT, FF.<\/li>\n<li><strong>MC/DC:<\/strong> <strong>3<\/strong> tests, e.g. TT, TF, FT.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-012", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q12 — MC/DC requirements", "prompt": "State the three requirements of MC/DC.", "answer": "1. Every **decision** takes each outcome.\n2. Every **condition** takes each outcome.\n3. Each condition is shown to **independently affect** the decision outcome: change that condition alone (with relevant others fixed) and the decision changes.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>State the three requirements of MC/DC.<\/p>\n", "answer_html": "<ol>\n<li>Every <strong>decision<\/strong> takes each outcome.<\/li>\n<li>Every <strong>condition<\/strong> takes each outcome.<\/li>\n<li>Each condition is shown to <strong>independently affect<\/strong> the decision outcome: change that condition alone (with relevant others fixed) and the decision changes.<\/li>\n<\/ol>\n"}, {"id": "l04-coverage-013", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q13 — MC/DC scaling", "prompt": "How many tests are typically needed for MC/DC with five conditions, versus multiple-condition coverage?", "answer": "MC/DC often needs **n+1 = 6** tests for 5 independent conditions, versus **2^5 = 32** for exhaustive multiple-condition coverage.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>How many tests are typically needed for MC/DC with five conditions, versus multiple-condition coverage?<\/p>\n", "answer_html": "<p>MC/DC often needs <strong>n+1 = 6<\/strong> tests for 5 independent conditions, versus <strong>2^5 = 32<\/strong> for exhaustive multiple-condition coverage.<\/p>\n"}, {"id": "l04-coverage-014", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q14 — MC/DC independence for A && B && C", "prompt": "Construct a minimal MC/DC set for `A && B && C` and show independence pairs.", "answer": "Use baseline **TTT → T** plus **FTT → F**, **TFT → F**, **TTF → F**. Compare TTT with each one-condition change: those three pairs independently demonstrate A, B, and C.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Construct a minimal MC/DC set for <code>A &amp;&amp; B &amp;&amp; C<\/code> and show independence pairs.<\/p>\n", "answer_html": "<p>Use baseline <strong>TTT → T<\/strong> plus <strong>FTT → F<\/strong>, <strong>TFT → F<\/strong>, <strong>TTF → F<\/strong>. Compare TTT with each one-condition change: those three pairs independently demonstrate A, B, and C.<\/p>\n"}, {"id": "l04-coverage-015", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q15 — MC/DC standards", "prompt": "Match DO-178C, ISO 26262, and IEC 62304 to their domains and MC/DC use.", "answer": "- **DO-178C → aerospace/airborne software**, MC/DC required at highest criticality (Level A).\n- **ISO 26262 → automotive**, MC/DC strongly recommended/used for high ASIL such as ASIL D.\n- **IEC 62304 → medical-device software**, structural coverage including strong criteria may be used for highest safety classes; follow project/regulatory interpretation.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Match DO-178C, ISO 26262, and IEC 62304 to their domains and MC/DC use.<\/p>\n", "answer_html": "<ul>\n<li><strong>DO-178C → aerospace/airborne software<\/strong>, MC/DC required at highest criticality (Level A).<\/li>\n<li><strong>ISO 26262 → automotive<\/strong>, MC/DC strongly recommended/used for high ASIL such as ASIL D.<\/li>\n<li><strong>IEC 62304 → medical-device software<\/strong>, structural coverage including strong criteria may be used for highest safety classes; follow project/regulatory interpretation.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-016", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q16 — Mutation score", "prompt": "72 of 100 mutants are killed; 10 are equivalent. Compute mutation score.", "answer": "Equivalent mutants are excluded: 72/(100−10) = 72/90 = **80%**.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>72 of 100 mutants are killed; 10 are equivalent. Compute mutation score.<\/p>\n", "answer_html": "<p>Equivalent mutants are excluded: 72/(100−10) = 72/90 = <strong>80%<\/strong>.<\/p>\n"}, {"id": "l04-coverage-017", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q17 — Mutation operators", "prompt": "Name five mutation-operator categories with examples.", "answer": "Examples: **arithmetic** `+→-`; **relational** `<→<=`; **logical** `&&→||`; **constant replacement** `0→1`; **statement deletion**. Other lecture operator sets may name AOR/ROR/LCR/UOI/ABS.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Name five mutation-operator categories with examples.<\/p>\n", "answer_html": "<p>Examples: <strong>arithmetic<\/strong> <code>+→-<\/code>; <strong>relational<\/strong> <code>&lt;→&lt;=<\/code>; <strong>logical<\/strong> <code>&amp;&amp;→||<\/code>; <strong>constant replacement<\/strong> <code>0→1<\/code>; <strong>statement deletion<\/strong>. Other lecture operator sets may name AOR/ROR/LCR/UOI/ABS.<\/p>\n"}, {"id": "l04-coverage-018", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q18 — Pairwise reduction", "prompt": "Four parameters each have three values: 81 exhaustive combinations. Roughly how many pairwise tests might suffice, and why?", "answer": "A representative pairwise covering array can be around **9 tests** rather than 81 (exact minimum depends constraints/tool). It ensures every pair of parameter values appears; empirical interaction studies show most faults are triggered by low-order interactions.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Four parameters each have three values: 81 exhaustive combinations. Roughly how many pairwise tests might suffice, and why?<\/p>\n", "answer_html": "<p>A representative pairwise covering array can be around <strong>9 tests<\/strong> rather than 81 (exact minimum depends constraints/tool). It ensures every pair of parameter values appears; empirical interaction studies show most faults are triggered by low-order interactions.<\/p>\n"}, {"id": "l04-coverage-019", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q19 — N-switch coverage", "prompt": "Differentiate 0-switch, 1-switch, and 2-switch state coverage.", "answer": "- **0-switch:** cover all states (or individual transitions depending convention; in this lecture table, all states).\n- **1-switch:** cover every single state transition.\n- **2-switch:** cover every sequence/pair of two consecutive transitions.\nHigher N exercises longer state histories and grows rapidly.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Differentiate 0-switch, 1-switch, and 2-switch state coverage.<\/p>\n", "answer_html": "<ul>\n<li><strong>0-switch:<\/strong> cover all states (or individual transitions depending convention; in this lecture table, all states).<\/li>\n<li><strong>1-switch:<\/strong> cover every single state transition.<\/li>\n<li><strong>2-switch:<\/strong> cover every sequence/pair of two consecutive transitions.\nHigher N exercises longer state histories and grows rapidly.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-020", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q20 — What coverage does and does not measure", "prompt": "State three things coverage measures and three it does not.", "answer": "Coverage measures **executed code elements, traversed paths/branches, or exercised conditions/mutants**, depending metric. It does **not** prove oracle correctness, detect code that should exist but is missing, or guarantee requirements/usability/security coverage. High traversal ≠ high verification quality.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>State three things coverage measures and three it does not.<\/p>\n", "answer_html": "<p>Coverage measures <strong>executed code elements, traversed paths/branches, or exercised conditions/mutants<\/strong>, depending metric. It does <strong>not<\/strong> prove oracle correctness, detect code that should exist but is missing, or guarantee requirements/usability/security coverage. High traversal ≠ high verification quality.<\/p>\n"}, {"id": "l04-coverage-021", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q21 — Coverage–effectiveness size confounding", "prompt": "What confounder destroys much of the observed coverage/effectiveness correlation, and how large is the effect?", "answer": "The confounder is **test-suite size**: more tests both raise coverage and find more faults. In the lecture evidence, controlling for size drives the coverage/effectiveness correlation toward ~0. Later figures attribute about **69%** of statement-coverage and **81.9%** of branch-coverage correlation to suite size.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>What confounder destroys much of the observed coverage/effectiveness correlation, and how large is the effect?<\/p>\n", "answer_html": "<p>The confounder is <strong>test-suite size<\/strong>: more tests both raise coverage and find more faults. In the lecture evidence, controlling for size drives the coverage/effectiveness correlation toward ~0. Later figures attribute about <strong>69%<\/strong> of statement-coverage and <strong>81.9%<\/strong> of branch-coverage correlation to suite size.<\/p>\n"}, {"id": "l04-coverage-022", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q22 — Assertions vs coverage", "prompt": "What correlates more strongly with test effectiveness: assertion quantity or coverage?", "answer": "**Assertion quantity**. The cited study reports very strong correlations around **0.927–0.973**, while statement coverage alone is much weaker. Coverage measures exploration; assertions provide the oracle/verification.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>What correlates more strongly with test effectiveness: assertion quantity or coverage?<\/p>\n", "answer_html": "<p><strong>Assertion quantity<\/strong>. The cited study reports very strong correlations around <strong>0.927–0.973<\/strong>, while statement coverage alone is much weaker. Coverage measures exploration; assertions provide the oracle/verification.<\/p>\n"}, {"id": "l04-coverage-023", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q23 — Coverage criteria effectiveness", "prompt": "What fault-detection rates are cited for statement coverage and data-flow coverage?", "answer": "The lecture's Hemmati summary reports about **10%** for statement coverage versus about **85%** when data-flow (definition–use) coverage is included.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>What fault-detection rates are cited for statement coverage and data-flow coverage?<\/p>\n", "answer_html": "<p>The lecture's Hemmati summary reports about <strong>10%<\/strong> for statement coverage versus about <strong>85%<\/strong> when data-flow (definition–use) coverage is included.<\/p>\n"}, {"id": "l04-coverage-024", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q24 — Coverage anti-patterns", "prompt": "Name three coverage anti-patterns and why they are harmful.", "answer": "Examples: tests written only to raise the number; threshold gaming (“ship at 85%”); tests that execute code with weak/no assertions; treating low coverage as an individual blame metric. They optimize the proxy and can create high coverage without fault-revealing checks.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Name three coverage anti-patterns and why they are harmful.<\/p>\n", "answer_html": "<p>Examples: tests written only to raise the number; threshold gaming (“ship at 85%”); tests that execute code with weak/no assertions; treating low coverage as an individual blame metric. They optimize the proxy and can create high coverage without fault-revealing checks.<\/p>\n"}, {"id": "l04-coverage-025", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q25 — Choosing a coverage criterion", "prompt": "Match contexts to statement, branch, MC/DC, and basis-path coverage.", "answer": "- Minimum bar for ordinary code → **Statement**.\n- Default stronger unit criterion → **Branch**.\n- Safety-critical DO-178C Level A → **MC/DC**.\n- Complex control flow → **Basis Path**.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Match contexts to statement, branch, MC/DC, and basis-path coverage.<\/p>\n", "answer_html": "<ul>\n<li>Minimum bar for ordinary code → <strong>Statement<\/strong>.<\/li>\n<li>Default stronger unit criterion → <strong>Branch<\/strong>.<\/li>\n<li>Safety-critical DO-178C Level A → <strong>MC/DC<\/strong>.<\/li>\n<li>Complex control flow → <strong>Basis Path<\/strong>.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-026", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q26 — Recommended coverage targets", "prompt": "Recall the lecture's minimum/target levels for statement, branch, and mutation coverage.", "answer": "Lecture guideline table:\n- **Statement:** min ~70%, target ~80%.\n- **Branch:** min ~75%, target ~85%.\n- **Mutation:** min ~60%, target ~80%.\nThese are heuristics, not universal release guarantees.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Recall the lecture's minimum/target levels for statement, branch, and mutation coverage.<\/p>\n", "answer_html": "<p>Lecture guideline table:<\/p>\n<ul>\n<li><strong>Statement:<\/strong> min ~70%, target ~80%.<\/li>\n<li><strong>Branch:<\/strong> min ~75%, target ~85%.<\/li>\n<li><strong>Mutation:<\/strong> min ~60%, target ~80%.\nThese are heuristics, not universal release guarantees.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-027", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q27 — Coverage tools by language", "prompt": "Match JaCoCo, Coverage.py, LLVM-cov, and c8 to languages.", "answer": "- **JaCoCo → Java**.\n- **Coverage.py → Python**.\n- **LLVM-cov → C/C++** (also LLVM-supported languages).\n- **c8 → JavaScript/TypeScript (Node/V8)**.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>Match JaCoCo, Coverage.py, LLVM-cov, and c8 to languages.<\/p>\n", "answer_html": "<ul>\n<li><strong>JaCoCo → Java<\/strong>.<\/li>\n<li><strong>Coverage.py → Python<\/strong>.<\/li>\n<li><strong>LLVM-cov → C/C++<\/strong> (also LLVM-supported languages).<\/li>\n<li><strong>c8 → JavaScript/TypeScript (Node/V8)<\/strong>.<\/li>\n<\/ul>\n"}, {"id": "l04-coverage-028", "topic": "L04 — Adequacy Criteria / Coverage", "section": "L04 — Adequacy Criteria / Coverage", "label": "Q28 — Oracle problem", "prompt": "What is the oracle problem, and how can it be mitigated?", "answer": "The oracle problem is deciding whether an observed output is **correct** for arbitrary test inputs. Mitigations: reference implementations, assertions/contracts, metamorphic relations/properties, differential testing, model-based expected results, sanitizers/crash oracles, and human/domain review.", "answer_kind": "answer / self-check", "source_path": "L04_Coverage.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L04_Coverage.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L04_Coverage.md", "prompt_html": "<p>What is the oracle problem, and how can it be mitigated?<\/p>\n", "answer_html": "<p>The oracle problem is deciding whether an observed output is <strong>correct<\/strong> for arbitrary test inputs. Mitigations: reference implementations, assertions/contracts, metamorphic relations/properties, differential testing, model-based expected results, sanitizers/crash oracles, and human/domain review.<\/p>\n"}, {"id":
