mple", "prompt": "Why did exploratory testing find coupon bugs that scripted cases missed?", "answer": "The tester chained unusual actions—reapply coupons, combine with sale items, remove cart items after discount, use multiple tabs. These interactions were outside predefined scripts. ET uses each observation to generate the next hypothesis, so it explores emergent state combinations rather than only specified happy paths.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Why did exploratory testing find coupon bugs that scripted cases missed?<\/p>\n", "answer_html": "<p>The tester chained unusual actions—reapply coupons, combine with sale items, remove cart items after discount, use multiple tabs. These interactions were outside predefined scripts. ET uses each observation to generate the next hypothesis, so it explores emergent state combinations rather than only specified happy paths.<\/p>\n"}, {"id": "l07-exploratory-op-005", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q5 — Exploratory charter", "prompt": "What is a charter and what template should you remember?", "answer": "A charter gives a session a mission without prescribing exact steps. Template: **Explore [target] using [resources/heuristics] to discover [information/risks].** It focuses exploration and makes the session reviewable.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>What is a charter and what template should you remember?<\/p>\n", "answer_html": "<p>A charter gives a session a mission without prescribing exact steps. Template: <strong>Explore [target] using [resources/heuristics] to discover [information/risks].<\/strong> It focuses exploration and makes the session reviewable.<\/p>\n"}, {"id": "l07-exploratory-op-006", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q6 — Hendrickson heuristics", "prompt": "Describe three exploratory-testing heuristics with examples.", "answer": "Any three: **None/Some/All** (permissions/items); **Too Big/Too Small/Just Right** (upload sizes); **Zero/One/Many** (item count); **Beginning/Middle/End** (position); **CRUD**; data-type attacks; injection. A good answer names the heuristic, the perturbation, and the likely defect class.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Describe three exploratory-testing heuristics with examples.<\/p>\n", "answer_html": "<p>Any three: <strong>None/Some/All<\/strong> (permissions/items); <strong>Too Big/Too Small/Just Right<\/strong> (upload sizes); <strong>Zero/One/Many<\/strong> (item count); <strong>Beginning/Middle/End<\/strong> (position); <strong>CRUD<\/strong>; data-type attacks; injection. A good answer names the heuristic, the perturbation, and the likely defect class.<\/p>\n"}, {"id": "l07-exploratory-op-007", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q7 — Session-Based Test Management", "prompt": "Why was SBTM created and what are its four pillars?", "answer": "SBTM makes exploratory work **manageable and auditable** without scripting it. Four pillars: **Charter, Time box (often 60–120 min), Reviewable result/notes, Debriefing**.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Why was SBTM created and what are its four pillars?<\/p>\n", "answer_html": "<p>SBTM makes exploratory work <strong>manageable and auditable<\/strong> without scripting it. Four pillars: <strong>Charter, Time box (often 60–120 min), Reviewable result/notes, Debriefing<\/strong>.<\/p>\n"}, {"id": "l07-exploratory-op-008", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q8 — Whittaker's five districts", "prompt": "Name Whittaker's five exploratory-testing districts and their focus.", "answer": "- **Business:** core value/features.\n- **Historical:** legacy/bug-prone areas.\n- **Entertainment:** unusual/adversarial behavior.\n- **Tourist:** first-time/visible user experience.\n- **Hotel:** background/supporting/long-running operations.\nSpecific tours sit inside these districts.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Name Whittaker's five exploratory-testing districts and their focus.<\/p>\n", "answer_html": "<ul>\n<li><strong>Business:<\/strong> core value/features.<\/li>\n<li><strong>Historical:<\/strong> legacy/bug-prone areas.<\/li>\n<li><strong>Entertainment:<\/strong> unusual/adversarial behavior.<\/li>\n<li><strong>Tourist:<\/strong> first-time/visible user experience.<\/li>\n<li><strong>Hotel:<\/strong> background/supporting/long-running operations.\nSpecific tours sit inside these districts.<\/li>\n<\/ul>\n"}, {"id": "l07-exploratory-op-009", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q9 — Five levels of exploration", "prompt": "Describe the five levels from freestyle to fully scripted and when to use them.", "answer": "1. **Freestyle:** only product; maximum discovery, least repeatability.\n2. **High exploration:** charter/goals.\n3. **Medium:** charter + starting points/data.\n4. **Low exploration:** detailed activities but tester judgment remains.\n5. **Fully scripted:** exact steps/results.\nUse more exploration for discovery/uncertainty; more scripting for repeatability/regulatory regression.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Describe the five levels from freestyle to fully scripted and when to use them.<\/p>\n", "answer_html": "<ol>\n<li><strong>Freestyle:<\/strong> only product; maximum discovery, least repeatability.<\/li>\n<li><strong>High exploration:<\/strong> charter/goals.<\/li>\n<li><strong>Medium:<\/strong> charter + starting points/data.<\/li>\n<li><strong>Low exploration:<\/strong> detailed activities but tester judgment remains.<\/li>\n<li><strong>Fully scripted:<\/strong> exact steps/results.\nUse more exploration for discovery/uncertainty; more scripting for repeatability/regulatory regression.<\/li>\n<\/ol>\n"}, {"id": "l07-exploratory-op-010", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q10 — Evidence for ET effectiveness", "prompt": "Summarize the empirical evidence cited for exploratory testing.", "answer": "Lecture summary: ET often finds **similar defect counts with much less total effort**, reported as roughly **4–6× more efficient** in some comparisons; equal-time experiments found substantially more defects (about **4.6×** in one study); usability defects were especially strong; industry surveys report high adoption (~**88%**). Context and tester skill matter.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Summarize the empirical evidence cited for exploratory testing.<\/p>\n", "answer_html": "<p>Lecture summary: ET often finds <strong>similar defect counts with much less total effort<\/strong>, reported as roughly <strong>4–6× more efficient<\/strong> in some comparisons; equal-time experiments found substantially more defects (about <strong>4.6×<\/strong> in one study); usability defects were especially strong; industry surveys report high adoption (~<strong>88%<\/strong>). Context and tester skill matter.<\/p>\n"}, {"id": "l07-exploratory-op-011", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q11 — Responding to “ET is just ad-hoc”", "prompt": "How would you rebut that claim with process and evidence?", "answer": "Show structure: charters, heuristics, time boxes, session notes, debriefing, coverage/risk notes, and regression conversion. Then cite evidence that controlled studies found ET comparable or better in defect detection/efficiency. The key difference is **adaptive design with accountability**, not absence of method.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>How would you rebut that claim with process and evidence?<\/p>\n", "answer_html": "<p>Show structure: charters, heuristics, time boxes, session notes, debriefing, coverage/risk notes, and regression conversion. Then cite evidence that controlled studies found ET comparable or better in defect detection/efficiency. The key difference is <strong>adaptive design with accountability<\/strong>, not absence of method.<\/p>\n"}, {"id": "l07-exploratory-op-012", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q12 — The ET coverage paradox", "prompt": "Why can ET achieve lower structural coverage but comparable defect counts?", "answer": "Coverage records **where execution went**, not how fault-revealing the inputs/oracles were. ET concentrates on anomalies, boundaries, interactions, and defect-dense areas rather than uniformly traversing code. It can therefore get more fault information per executed path while leaving benign code uncovered.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Why can ET achieve lower structural coverage but comparable defect counts?<\/p>\n", "answer_html": "<p>Coverage records <strong>where execution went<\/strong>, not how fault-revealing the inputs/oracles were. ET concentrates on anomalies, boundaries, interactions, and defect-dense areas rather than uniformly traversing code. It can therefore get more fault information per executed path while leaving benign code uncovered.<\/p>\n"}, {"id": "l07-exploratory-op-013", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q13 — Operational profile definition", "prompt": "Define an operational profile and give probabilities.", "answer": "An OP is the **set of operations and their occurrence probabilities** for a defined user population/mode. Example: login 0.20, search 0.50, checkout 0.20, account admin 0.10; probabilities sum to 1. It is a quantitative model of real use.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Define an operational profile and give probabilities.<\/p>\n", "answer_html": "<p>An OP is the <strong>set of operations and their occurrence probabilities<\/strong> for a defined user population/mode. Example: login 0.20, search 0.50, checkout 0.20, account admin 0.10; probabilities sum to 1. It is a quantitative model of real use.<\/p>\n"}, {"id": "l07-exploratory-op-014", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q14 — Function vs operation vs run", "prompt": "Distinguish Musa's function, operation, and run.", "answer": "- **Function:** user-visible capability/requirement, e.g. relocate telephone.\n- **Operation:** design-level task invoked to provide a function, e.g. remove + install.\n- **Run:** one concrete execution of an operation.\nThe OP is usually built at operation/run granularity useful for testing.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Distinguish Musa's function, operation, and run.<\/p>\n", "answer_html": "<ul>\n<li><strong>Function:<\/strong> user-visible capability/requirement, e.g. relocate telephone.<\/li>\n<li><strong>Operation:<\/strong> design-level task invoked to provide a function, e.g. remove + install.<\/li>\n<li><strong>Run:<\/strong> one concrete execution of an operation.\nThe OP is usually built at operation/run granularity useful for testing.<\/li>\n<\/ul>\n"}, {"id": "l07-exploratory-op-015", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q15 — Operational mode", "prompt": "What is an operational mode? Give examples.", "answer": "A mode is a context with a distinct usage distribution. Examples: **peak vs off-peak**, **customer vs admin**, **normal vs degraded/maintenance**, **novice vs expert**, **normal vs emergency**. The same operation can have different probability in each mode.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>What is an operational mode? Give examples.<\/p>\n", "answer_html": "<p>A mode is a context with a distinct usage distribution. Examples: <strong>peak vs off-peak<\/strong>, <strong>customer vs admin<\/strong>, <strong>normal vs degraded/maintenance<\/strong>, <strong>novice vs expert<\/strong>, <strong>normal vs emergency<\/strong>. The same operation can have different probability in each mode.<\/p>\n"}, {"id": "l07-exploratory-op-016", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q16 — Why probabilities sum to 1", "prompt": "Why must OP probabilities total 1.0?", "answer": "They represent a complete probability distribution over mutually considered operations in the mode. A sum >1 double-counts/over-allocates probability; <1 means missing/unallocated behavior. Rates should be normalized: p_i = rate_i / Σ rates.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Why must OP probabilities total 1.0?<\/p>\n", "answer_html": "<p>They represent a complete probability distribution over mutually considered operations in the mode. A sum &gt;1 double-counts/over-allocates probability; &lt;1 means missing/unallocated behavior. Rates should be normalized: p_i = rate_i / Σ rates.<\/p>\n"}, {"id": "l07-exploratory-op-017", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q17 — Musa six-step OP procedure", "prompt": "Walk through the six steps for a university enrollment system.", "answer": "1. Determine **operational modes** (registration peak/normal).\n2. Identify **initiators** (students, staff, scheduled jobs).\n3. Choose **representation** (table/tree).\n4. List **operations** (search course, enroll, drop, pay, etc.).\n5. Estimate/measure **occurrence rates** from logs/surveys.\n6. Normalize to **probabilities** and validate with stakeholders.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Walk through the six steps for a university enrollment system.<\/p>\n", "answer_html": "<ol>\n<li>Determine <strong>operational modes<\/strong> (registration peak/normal).<\/li>\n<li>Identify <strong>initiators<\/strong> (students, staff, scheduled jobs).<\/li>\n<li>Choose <strong>representation<\/strong> (table/tree).<\/li>\n<li>List <strong>operations<\/strong> (search course, enroll, drop, pay, etc.).<\/li>\n<li>Estimate/measure <strong>occurrence rates<\/strong> from logs/surveys.<\/li>\n<li>Normalize to <strong>probabilities<\/strong> and validate with stakeholders.<\/li>\n<\/ol>\n"}, {"id": "l07-exploratory-op-018", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q18 — Tabular vs graphical OP", "prompt": "When should an OP be tabular vs graphical?", "answer": "Use a **table** for a small/flat operation set with one/few initiator types. Use a **graph/tree** when there are multiple initiator classes, modes, or hierarchical operations and the structure aids understanding. Start simple; add hierarchy when it reduces ambiguity.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>When should an OP be tabular vs graphical?<\/p>\n", "answer_html": "<p>Use a <strong>table<\/strong> for a small/flat operation set with one/few initiator types. Use a <strong>graph/tree<\/strong> when there are multiple initiator classes, modes, or hierarchical operations and the structure aids understanding. Start simple; add hierarchy when it reduces ambiguity.<\/p>\n"}, {"id": "l07-exploratory-op-019", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q19 — Operational-profile calculation", "prompt": "Rates are GET /users 4000, POST /orders 2500, GET /products 3000, PUT /users 500 per hour. Compute probabilities.", "answer": "Total = **10,000/hr**. Probabilities:\n- GET /users = **0.40**\n- POST /orders = **0.25**\n- GET /products = **0.30**\n- PUT /users = **0.05**\nSum = 1.00.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Rates are GET /users 4000, POST /orders 2500, GET /products 3000, PUT /users 500 per hour. Compute probabilities.<\/p>\n", "answer_html": "<p>Total = <strong>10,000/hr<\/strong>. Probabilities:<\/p>\n<ul>\n<li>GET /users = <strong>0.40<\/strong><\/li>\n<li>POST /orders = <strong>0.25<\/strong><\/li>\n<li>GET /products = <strong>0.30<\/strong><\/li>\n<li>PUT /users = <strong>0.05<\/strong>\nSum = 1.00.<\/li>\n<\/ul>\n"}, {"id": "l07-exploratory-op-020", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q20 — AT&T and HP operational-profile results", "prompt": "What industrial results are cited for OP adoption?", "answer": "Lecture summary: **AT&T Definity PBX** reported about **10× fewer customer problems** and roughly halved the test cycle; **HP** reported at least **50% reduction in test time/cost**. Treat these as historical case evidence, not universal guarantees.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>What industrial results are cited for OP adoption?<\/p>\n", "answer_html": "<p>Lecture summary: <strong>AT&amp;T Definity PBX<\/strong> reported about <strong>10× fewer customer problems<\/strong> and roughly halved the test cycle; <strong>HP<\/strong> reported at least <strong>50% reduction in test time/cost<\/strong>. Treat these as historical case evidence, not universal guarantees.<\/p>\n"}, {"id": "l07-exploratory-op-021", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q21 — Operational coverage", "prompt": "Define operational coverage and contrast it with traditional coverage.", "answer": "Traditional coverage weights each code element equally. **Operational coverage weights coverage by usage probability**: roughly Σ(coverage of operation_i × usage_i). It asks whether the suite covers what users actually do frequently, making it more relevant to reliability under field usage.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Define operational coverage and contrast it with traditional coverage.<\/p>\n", "answer_html": "<p>Traditional coverage weights each code element equally. <strong>Operational coverage weights coverage by usage probability<\/strong>: roughly Σ(coverage of operation_i × usage_i). It asks whether the suite covers what users actually do frequently, making it more relevant to reliability under field usage.<\/p>\n"}, {"id": "l07-exploratory-op-022", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q22 — Android Cloud Profiles", "prompt": "What are Android Cloud Profiles and what key numbers matter?", "answer": "They are usage-derived profiles of methods exercised by real Android users, used to guide optimization/testing relevance. Lecture figures: profiles available for about **99.89%** of top apps; average profile size about **7.88% of methods**; automated tools reached <~70% of profile coverage. The striking point is how small the actually-used method slice can be.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>What are Android Cloud Profiles and what key numbers matter?<\/p>\n", "answer_html": "<p>They are usage-derived profiles of methods exercised by real Android users, used to guide optimization/testing relevance. Lecture figures: profiles available for about <strong>99.89%<\/strong> of top apps; average profile size about <strong>7.88% of methods<\/strong>; automated tools reached &lt;~70% of profile coverage. The striking point is how small the actually-used method slice can be.<\/p>\n"}, {"id": "l07-exploratory-op-023", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q23 — OP–ET saturation handoff", "prompt": "Why do OP and ET complement each other?", "answer": "OP efficiently covers high-probability behavior first. As automated/usage-driven coverage saturates (lecture discussion around **~70%**), additional OP tests yield diminishing novelty. ET then targets the remaining uncertain/rare/interacting behavior with human reasoning—**quantitative first, qualitative exploration next**.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Why do OP and ET complement each other?<\/p>\n", "answer_html": "<p>OP efficiently covers high-probability behavior first. As automated/usage-driven coverage saturates (lecture discussion around <strong>~70%<\/strong>), additional OP tests yield diminishing novelty. ET then targets the remaining uncertain/rare/interacting behavior with human reasoning—<strong>quantitative first, qualitative exploration next<\/strong>.<\/p>\n"}, {"id": "l07-exploratory-op-024", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q24 — Two-phase testing strategy", "prompt": "Describe the OP→ET strategy and why OP comes first.", "answer": "Phase 1: build OP, allocate tests by usage, measure operational coverage, continue until saturation. Phase 2: use ET charters/tours focused by OP/risk, discover edge/usability/interaction defects, convert discoveries to regression tests. OP first cheaply secures common real-world behavior and gives ET a risk map.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Describe the OP→ET strategy and why OP comes first.<\/p>\n", "answer_html": "<p>Phase 1: build OP, allocate tests by usage, measure operational coverage, continue until saturation. Phase 2: use ET charters/tours focused by OP/risk, discover edge/usability/interaction defects, convert discoveries to regression tests. OP first cheaply secures common real-world behavior and gives ET a risk map.<\/p>\n"}, {"id": "l07-exploratory-op-025", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q25 — Startup: OP or ET first?", "prompt": "A startup has little test time. Should it build an OP or train testers in ET?", "answer": "It depends on evidence. If it has reliable telemetry and a stability/reliability goal, a lightweight OP quickly prioritizes scarce test effort. If usage is still changing and telemetry is sparse, **ET may deliver more value first** because it explores uncertainty. A pragmatic startup often starts with simple telemetry-derived frequencies + a few high-risk ET charters.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>A startup has little test time. Should it build an OP or train testers in ET?<\/p>\n", "answer_html": "<p>It depends on evidence. If it has reliable telemetry and a stability/reliability goal, a lightweight OP quickly prioritizes scarce test effort. If usage is still changing and telemetry is sparse, <strong>ET may deliver more value first<\/strong> because it explores uncertainty. A pragmatic startup often starts with simple telemetry-derived frequencies + a few high-risk ET charters.<\/p>\n"}, {"id": "l07-exploratory-op-026", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q26 — Accountability: SBTM vs OP", "prompt": "Compare how SBTM and operational profiles make testing accountable.", "answer": "**SBTM** accountability is qualitative/session-based: charter, time spent, notes, findings, debrief. **OP** accountability is quantitative: operation list, rates/probabilities, allocated tests, operational coverage/reliability results. One records reasoning/work; the other records usage-weighted allocation/evidence.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Compare how SBTM and operational profiles make testing accountable.<\/p>\n", "answer_html": "<p><strong>SBTM<\/strong> accountability is qualitative/session-based: charter, time spent, notes, findings, debrief. <strong>OP<\/strong> accountability is quantitative: operation list, rates/probabilities, allocated tests, operational coverage/reliability results. One records reasoning/work; the other records usage-weighted allocation/evidence.<\/p>\n"}, {"id": "l07-exploratory-op-027", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q27 — Banking-app OP + ET strategy", "prompt": "Design a combined strategy for a mobile banking app.", "answer": "OP: derive frequencies for login, balance, transfer, bill pay, card controls; weight regression/reliability runs accordingly and split modes (normal/peak/fraud incident). ET charters: transfer limits/boundaries, concurrent sessions, interrupted network, stale balances, role/security tours, money-tour around fees/rounding. Convert every confirmed ET defect to regression.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Design a combined strategy for a mobile banking app.<\/p>\n", "answer_html": "<p>OP: derive frequencies for login, balance, transfer, bill pay, card controls; weight regression/reliability runs accordingly and split modes (normal/peak/fraud incident). ET charters: transfer limits/boundaries, concurrent sessions, interrupted network, stale balances, role/security tours, money-tour around fees/rounding. Convert every confirmed ET defect to regression.<\/p>\n"}, {"id": "l07-exploratory-op-028", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q28 — Operational vs traditional coverage", "prompt": "Why can operational coverage be a more useful signal?", "answer": "It discounts rarely used code and emphasizes heavily used behavior, so it aligns coverage with **field failure exposure** rather than code size alone. This helps reliability decisions; however rare safety/security paths can still be critical and must be covered by risk analysis even if usage probability is tiny.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Why can operational coverage be a more useful signal?<\/p>\n", "answer_html": "<p>It discounts rarely used code and emphasizes heavily used behavior, so it aligns coverage with <strong>field failure exposure<\/strong> rather than code size alone. This helps reliability decisions; however rare safety/security paths can still be critical and must be covered by risk analysis even if usage probability is tiny.<\/p>\n"}, {"id": "l07-exploratory-op-029", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q29 — What Cloud Profiles teach about assumptions", "prompt": "How do Android Cloud Profiles support “you cannot assume how users use software”?", "answer": "Observed profiles are sparse and differ from developer-authored baseline expectations; automated model-based explorers also miss a significant share of user-relevant behavior. The evidence says design intuition/test models are imperfect proxies for field usage—collect telemetry where possible and preserve exploration for the unknown remainder.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>How do Android Cloud Profiles support “you cannot assume how users use software”?<\/p>\n", "answer_html": "<p>Observed profiles are sparse and differ from developer-authored baseline expectations; automated model-based explorers also miss a significant share of user-relevant behavior. The evidence says design intuition/test models are imperfect proxies for field usage—collect telemetry where possible and preserve exploration for the unknown remainder.<\/p>\n"}, {"id": "l07-exploratory-op-030", "topic": "L07 — Exploratory Testing & Operational Profiles", "section": "L07 — Exploratory Testing & Operational Profiles", "label": "Q30 — Five-minute L07 summary", "prompt": "Give a compact explanation of ET, OP, and their bridge.", "answer": "ET = adaptive human discovery with charters/heuristics/SBTM. OP = quantitative operation probabilities used to prioritize tests and estimate reliability. OP gives efficient coverage of common behavior; ET finds emergent/rare/interacting problems. A strong strategy uses **OP first for usage-weighted confidence, ET after saturation, then regression-script discoveries**.", "answer_kind": "answer / self-check", "source_path": "L07_Exploratory_OP.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L07_Exploratory_OP.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L07_Exploratory_OP.md", "prompt_html": "<p>Give a compact explanation of ET, OP, and their bridge.<\/p>\n", "answer_html": "<p>ET = adaptive human discovery with charters/heuristics/SBTM. OP = quantitative operation probabilities used to prioritize tests and estimate reliability. OP gives efficient coverage of common behavior; ET finds emergent/rare/interacting problems. A strong strategy uses <strong>OP first for usage-weighted confidence, ET after saturation, then regression-script discoveries<\/strong>.<\/p>\n"}, {"id": "l08-reliability-001", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q1 — Fault → error → failure in a real incident", "prompt": "Trace one real incident through fault, error, and failure.", "answer": "Use one case and keep levels distinct. Example CrowdStrike 2024: **fault** = invalid content/update accepted by validation/design; **error** = sensor/kernel code enters invalid memory/state while parsing it; **failure** = Windows hosts crash/boot-loop visibly. Fault is latent cause, error is incorrect internal state, failure is externally observed service deviation.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Trace one real incident through fault, error, and failure.<\/p>\n", "answer_html": "<p>Use one case and keep levels distinct. Example CrowdStrike 2024: <strong>fault<\/strong> = invalid content/update accepted by validation/design; <strong>error<\/strong> = sensor/kernel code enters invalid memory/state while parsing it; <strong>failure<\/strong> = Windows hosts crash/boot-loop visibly. Fault is latent cause, error is incorrect internal state, failure is externally observed service deviation.<\/p>\n"}, {"id": "l08-reliability-002", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q2 — Hardware vs software reliability curves", "prompt": "Why does the hardware bathtub curve not apply to software?", "answer": "Hardware has physical infant mortality and wear-out. Software does **not physically wear**: the same binary fails on triggering states/inputs. Its observed failure rate usually decreases as faults are removed, with spikes after changes that introduce new faults—often a downward/sawtooth pattern rather than a wear-out curve.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Why does the hardware bathtub curve not apply to software?<\/p>\n", "answer_html": "<p>Hardware has physical infant mortality and wear-out. Software does <strong>not physically wear<\/strong>: the same binary fails on triggering states/inputs. Its observed failure rate usually decreases as faults are removed, with spikes after changes that introduce new faults—often a downward/sawtooth pattern rather than a wear-out curve.<\/p>\n"}, {"id": "l08-reliability-003", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q3 — Failure Severity Classification", "prompt": "Design four severity classes for a hospital patient portal.", "answer": "Use **human-life/capability impact** as the primary criterion. Example: C1 life-threatening wrong/hidden critical result; C2 severe clinical delay/data corruption; C3 non-critical feature outage with workaround; C4 cosmetic/minor inconvenience. Define objective boundaries and examples so stakeholders classify failures consistently.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Design four severity classes for a hospital patient portal.<\/p>\n", "answer_html": "<p>Use <strong>human-life/capability impact<\/strong> as the primary criterion. Example: C1 life-threatening wrong/hidden critical result; C2 severe clinical delay/data corruption; C3 non-critical feature outage with workaround; C4 cosmetic/minor inconvenience. Define objective boundaries and examples so stakeholders classify failures consistently.<\/p>\n"}, {"id": "l08-reliability-004", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q4 — FIO from availability", "prompt": "A=99.9%, mean downtime per failure=2 min=0.033 h. Compute λ, MTTF, and failures/month (720 h) using the exact formula.", "answer": "λ=(1−A)/(A×t_m)=0.001/(0.999×0.033) ≈ **0.0303 failures/h**. MTTF=1/λ ≈ **32.97 h**. Expected failures in 720 h ≈ **21.84**. High availability can coexist with frequent failures when recovery is very fast.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>A=99.9%, mean downtime per failure=2 min=0.033 h. Compute λ, MTTF, and failures/month (720 h) using the exact formula.<\/p>\n", "answer_html": "<p>λ=(1−A)/(A×t_m)=0.001/(0.999×0.033) ≈ <strong>0.0303 failures/h<\/strong>. MTTF=1/λ ≈ <strong>32.97 h<\/strong>. Expected failures in 720 h ≈ <strong>21.84<\/strong>. High availability can coexist with frequent failures when recovery is very fast.<\/p>\n"}, {"id": "l08-reliability-005", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q5 — When failure metrics mislead", "prompt": "Give cases where failure density and failure intensity each hide a reliability problem.", "answer": "Low **failure density** can still be dangerous if one defect lies on a hot path used constantly → high failure intensity. Low average **failure intensity** can hide severe user unreliability if failures cluster by user/mode, are correlated, or have catastrophic severity. Always pair frequency with exposure, severity, and operational profile.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Give cases where failure density and failure intensity each hide a reliability problem.<\/p>\n", "answer_html": "<p>Low <strong>failure density<\/strong> can still be dangerous if one defect lies on a hot path used constantly → high failure intensity. Low average <strong>failure intensity<\/strong> can hide severe user unreliability if failures cluster by user/mode, are correlated, or have catastrophic severity. Always pair frequency with exposure, severity, and operational profile.<\/p>\n"}, {"id": "l08-reliability-006", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q6 — Fault prevention vs fault tolerance", "prompt": "Compare prevention and tolerance for meeting an FIO.", "answer": "**Prevention** reduces introduced faults (reviews, safer design, standards) and is cheapest early, but cannot guarantee zero faults. **Tolerance** continues correct/acceptable service despite faults (redundancy, retries, failover, recovery) and is vital when failures are unavoidable/critical, but adds complexity/cost and may suffer common-mode failures. Use both by risk.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Compare prevention and tolerance for meeting an FIO.<\/p>\n", "answer_html": "<p><strong>Prevention<\/strong> reduces introduced faults (reviews, safer design, standards) and is cheapest early, but cannot guarantee zero faults. <strong>Tolerance<\/strong> continues correct/acceptable service despite faults (redundancy, retries, failover, recovery) and is vital when failures are unavoidable/critical, but adds complexity/cost and may suffer common-mode failures. Use both by risk.<\/p>\n"}, {"id": "l08-reliability-007", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q7 — Backward recovery and domino effect", "prompt": "Explain rollback in a two-service order/ship scenario and contrast forward recovery.", "answer": "If A rolls back after it already sent “ship” to B, A's restored state no longer matches B's committed action. To regain consistency B may also need rollback/compensation, possibly forcing further rollbacks—the **domino effect**. Forward recovery instead moves to a new consistent state, e.g. compensating transaction/cancel shipment, without rewinding all participants.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Explain rollback in a two-service order/ship scenario and contrast forward recovery.<\/p>\n", "answer_html": "<p>If A rolls back after it already sent “ship” to B, A's restored state no longer matches B's committed action. To regain consistency B may also need rollback/compensation, possibly forcing further rollbacks—the <strong>domino effect<\/strong>. Forward recovery instead moves to a new consistent state, e.g. compensating transaction/cancel shipment, without rewinding all participants.<\/p>\n"}, {"id": "l08-reliability-008", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q8 — Goel–Okumoto release calculation", "prompt": "Given a=80 faults, b=0.03/week, FIO=1/week, compute λ(0), λ(20), time to FIO, and faults found by release.", "answer": "λ(t)=ab·e^(−bt), m(t)=a(1−e^(−bt)).\n- λ(0)=80×0.03 = **2.4/week**.\n- λ(20)=2.4e^-0.6 ≈ **1.317/week**.\n- Set 1=2.4e^-0.03t → t≈ **29.18 weeks**.\n- m(t)=80(1−1/2.4)≈ **46.7 faults** found.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Given a=80 faults, b=0.03/week, FIO=1/week, compute λ(0), λ(20), time to FIO, and faults found by release.<\/p>\n", "answer_html": "<p>λ(t)=ab·e^(−bt), m(t)=a(1−e^(−bt)).<\/p>\n<ul>\n<li>λ(0)=80×0.03 = <strong>2.4/week<\/strong>.<\/li>\n<li>λ(20)=2.4e^-0.6 ≈ <strong>1.317/week<\/strong>.<\/li>\n<li>Set 1=2.4e^-0.03t → t≈ <strong>29.18 weeks<\/strong>.<\/li>\n<li>m(t)=80(1−1/2.4)≈ <strong>46.7 faults<\/strong> found.<\/li>\n<\/ul>\n"}, {"id": "l08-reliability-009", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q9 — Why N-version independence fails", "prompt": "Summarize Knight & Leveson and why it matters.", "answer": "Setup: **27 independently developed versions**, same specification/language, tested on **1,000,000 random cases**. Coincident failures were far above the independence model (lecture shorthand ~**29×**). Causes included difficult/collinear inputs, numerical precision traps, and shared specification ambiguity. Therefore multiplying independent reliabilities can grossly overstate N-version safety.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Summarize Knight &amp; Leveson and why it matters.<\/p>\n", "answer_html": "<p>Setup: <strong>27 independently developed versions<\/strong>, same specification/language, tested on <strong>1,000,000 random cases<\/strong>. Coincident failures were far above the independence model (lecture shorthand ~<strong>29×<\/strong>). Causes included difficult/collinear inputs, numerical precision traps, and shared specification ambiguity. Therefore multiplying independent reliabilities can grossly overstate N-version safety.<\/p>\n"}, {"id": "l08-reliability-010", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q10 — Three-version majority voting", "prompt": "Each version has Rc=0.95. Compute independent 2-of-3 reliability, then discuss 10% coincident failures.", "answer": "Independent majority reliability = 3R²(1−R)+R³ = **0.99275**. A single version is **0.95**. If 10% of the 5% component failure probability is a common-mode event, there is already a **0.5% system-failure floor** before independent residual failures; a simple mixture gives effective reliability around **0.989** (exact value depends on the dependence model). Key lesson: correlation erodes the redundancy gain.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Each version has Rc=0.95. Compute independent 2-of-3 reliability, then discuss 10% coincident failures.<\/p>\n", "answer_html": "<p>Independent majority reliability = 3R²(1−R)+R³ = <strong>0.99275<\/strong>. A single version is <strong>0.95<\/strong>. If 10% of the 5% component failure probability is a common-mode event, there is already a <strong>0.5% system-failure floor<\/strong> before independent residual failures; a simple mixture gives effective reliability around <strong>0.989<\/strong> (exact value depends on the dependence model). Key lesson: correlation erodes the redundancy gain.<\/p>\n"}, {"id": "l08-reliability-011", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q11 — SLO error budget", "prompt": "For 99.95% monthly availability and 50M requests, compute request/minute budgets and interpret 8 min outage + 5000 errors.", "answer": "Allowed error fraction = 0.0005. Request budget = 50,000,000×0.0005 = **25,000 requests**. For a 30-day month: 43,200×0.0005 = **21.6 min** downtime budget. Eight outage minutes consume ~**37%** of the time budget; 5,000 failed requests consume **20%** of the request budget. Do not add minutes and requests directly—choose a consistent SLI/error-budget policy.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>For 99.95% monthly availability and 50M requests, compute request/minute budgets and interpret 8 min outage + 5000 errors.<\/p>\n", "answer_html": "<p>Allowed error fraction = 0.0005. Request budget = 50,000,000×0.0005 = <strong>25,000 requests<\/strong>. For a 30-day month: 43,200×0.0005 = <strong>21.6 min<\/strong> downtime budget. Eight outage minutes consume ~<strong>37%<\/strong> of the time budget; 5,000 failed requests consume <strong>20%<\/strong> of the request budget. Do not add minutes and requests directly—choose a consistent SLI/error-budget policy.<\/p>\n"}, {"id": "l08-reliability-012", "topic": "L08 — Software Reliability", "section": "L08 — Software Reliability", "label": "Q12 — FIO vs SLO", "prompt": "Explain how FIO and SLO express the same underlying idea in different eras/contexts.", "answer": "Both set a **quantitative acceptable failure level** rather than demanding perfection. FIO is framed as allowable failure intensity during reliability engineering/testing; SLO sets a target for production service indicators. λ(t) corresponds to an error/failure-rate SLI, and “just-right reliability” corresponds to spending an **error budget** instead of overengineering beyond business need.", "answer_kind": "answer / self-check", "source_path": "L08_Reliability.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L08_Reliability.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L08_Reliability.md", "prompt_html": "<p>Explain how FIO and SLO express the same underlying idea in different eras/contexts.<\/p>\n", "answer_html": "<p>Both set a <strong>quantitative acceptable failure level<\/strong> rather than demanding perfection. FIO is framed as allowable failure intensity during reliability engineering/testing; SLO sets a target for production service indicators. λ(t) corresponds to an error/failure-rate SLI, and “just-right reliability” corresponds to spending an <strong>error budget<\/strong> instead of overengineering beyond business need.<\/p>\n"}, {"id": "l09-performance-001", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q1 — Business impact of latency", "prompt": "50k orders/day at $80; latency improves 1.2s→0.4s for $200k/year. Use 100ms≈1% sales and critique the estimate.", "answer": "Daily revenue = 50,000×$80 = $4M; annual ≈ **$1.46B**. 800 ms = eight 100-ms steps → heuristic **8%** uplift ≈ **$116.8M/year**, dwarfing $200k. But the heuristic is not causal/universal: conversion response may be nonlinear, baseline differs, order count may already include lost demand, seasonality/confounders matter, and infrastructure may affect more than latency.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>50k orders/day at $80; latency improves 1.2s→0.4s for $200k/year. Use 100ms≈1% sales and critique the estimate.<\/p>\n", "answer_html": "<p>Daily revenue = 50,000×$80 = $4M; annual ≈ <strong>$1.46B<\/strong>. 800 ms = eight 100-ms steps → heuristic <strong>8%<\/strong> uplift ≈ <strong>$116.8M/year<\/strong>, dwarfing $200k. But the heuristic is not causal/universal: conversion response may be nonlinear, baseline differs, order count may already include lost demand, seasonality/confounders matter, and infrastructure may affect more than latency.<\/p>\n"}, {"id": "l09-performance-002", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q2 — Performance engineering vs late testing", "prompt": "Why are design-time performance fixes much cheaper than production discoveries?", "answer": "Design review can change architecture before code/data/dependencies harden. Production fixes can require schema/service redesign, migrations, compatibility work, capacity, incident mitigation, and retesting. Example: chatty synchronous fan-out identified in architecture can become batching/async early; after launch it may require API redesign across services and clients.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Why are design-time performance fixes much cheaper than production discoveries?<\/p>\n", "answer_html": "<p>Design review can change architecture before code/data/dependencies harden. Production fixes can require schema/service redesign, migrations, compatibility work, capacity, incident mitigation, and retesting. Example: chatty synchronous fan-out identified in architecture can become batching/async early; after launch it may require API redesign across services and clients.<\/p>\n"}, {"id": "l09-performance-003", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q3 — Little's Law", "prompt": "N=250 active connections, R=125ms. Compute throughput; then N at R=80ms with same X; then effect of 40% lower R.", "answer": "Little's Law N=X·R. X=250/0.125 = **2000 req/s**. At 80 ms, N=2000×0.080 = **160**. A 40% reduction from 125 ms gives R=75 ms, so N=2000×0.075 = **150** concurrent requests at the same throughput.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>N=250 active connections, R=125ms. Compute throughput; then N at R=80ms with same X; then effect of 40% lower R.<\/p>\n", "answer_html": "<p>Little's Law N=X·R. X=250/0.125 = <strong>2000 req/s<\/strong>. At 80 ms, N=2000×0.080 = <strong>160<\/strong>. A 40% reduction from 125 ms gives R=75 ms, so N=2000×0.075 = <strong>150<\/strong> concurrent requests at the same throughput.<\/p>\n"}, {"id": "l09-performance-004", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q4 — Percentiles vs averages", "prompt": "Two endpoints both average 500ms; A p50/90/99=450/550/600, B=100/200/8000. Interpret UX and SLA p99<1000.", "answer": "Most users see **B** as faster (p50/p90 far lower), but **B violates the p99 SLA badly** and has extreme tail latency; A is consistent and meets it. Reporting p90 instead of mean would prioritize B's common-case experience, which is why multiple percentiles—especially the SLO percentile—must be monitored.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Two endpoints both average 500ms; A p50/90/99=450/550/600, B=100/200/8000. Interpret UX and SLA p99&lt;1000.<\/p>\n", "answer_html": "<p>Most users see <strong>B<\/strong> as faster (p50/p90 far lower), but <strong>B violates the p99 SLA badly<\/strong> and has extreme tail latency; A is consistent and meets it. Reporting p90 instead of mean would prioritize B's common-case experience, which is why multiple percentiles—especially the SLO percentile—must be monitored.<\/p>\n"}, {"id": "l09-performance-005", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q5 — Hockey-stick performance curve", "prompt": "Explain utilization U, throughput X, and response time R across light, heavy, and buckle zones; what does faster CPU do?", "answer": "- **Light load:** U rises, X rises roughly linearly, R near baseline.\n- **Heavy load:** U approaches saturation, X gains slow, queues grow, R rises sharply.\n- **Buckle/retrograde:** contention/coherency causes X to flatten or fall while R explodes.\nA faster CPU shifts the saturation/buckle point right/up, but cannot remove non-CPU bottlenecks or coordination limits.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Explain utilization U, throughput X, and response time R across light, heavy, and buckle zones; what does faster CPU do?<\/p>\n", "answer_html": "<ul>\n<li><strong>Light load:<\/strong> U rises, X rises roughly linearly, R near baseline.<\/li>\n<li><strong>Heavy load:<\/strong> U approaches saturation, X gains slow, queues grow, R rises sharply.<\/li>\n<li><strong>Buckle/retrograde:<\/strong> contention/coherency causes X to flatten or fall while R explodes.\nA faster CPU shifts the saturation/buckle point right/up, but cannot remove non-CPU bottlenecks or coordination limits.<\/li>\n<\/ul>\n"}, {"id": "l09-performance-006", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q6 — Amdahl optimization", "prompt": "45% DB sped 3×; compute speedup, max if DB infinite, and combined with 20% network sped 2×.", "answer": "DB only: S=1/(0.55+0.45/3)=1/0.70=**1.43×**. Infinite DB speed: 1/0.55=**1.82×** max. DB 3× + network 2×: new fraction=0.45/3+0.35+0.20/2=0.60 → **1.67×**.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>45% DB sped 3×; compute speedup, max if DB infinite, and combined with 20% network sped 2×.<\/p>\n", "answer_html": "<p>DB only: S=1/(0.55+0.45/3)=1/0.70=<strong>1.43×<\/strong>. Infinite DB speed: 1/0.55=<strong>1.82×<\/strong> max. DB 3× + network 2×: new fraction=0.45/3+0.35+0.20/2=0.60 → <strong>1.67×<\/strong>.<\/p>\n"}, {"id": "l09-performance-007", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q7 — Amdahl vs Gustafson", "prompt": "10 min serial loading + 50 min parallel training on 1 GPU. What happens with 10 GPUs and which law fits scale-up?", "answer": "Fixed problem (Amdahl): 10 + 50/10 = **15 min** idealized. Gustafson view: keep the 60-min wall-clock budget; after 10 min serial work, 10 GPUs provide **500 GPU-min** of parallel training—roughly a 10× larger parallel workload. Use Amdahl for fixed-size speedup; Gustafson when the problem grows with resources.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>10 min serial loading + 50 min parallel training on 1 GPU. What happens with 10 GPUs and which law fits scale-up?<\/p>\n", "answer_html": "<p>Fixed problem (Amdahl): 10 + 50/10 = <strong>15 min<\/strong> idealized. Gustafson view: keep the 60-min wall-clock budget; after 10 min serial work, 10 GPUs provide <strong>500 GPU-min<\/strong> of parallel training—roughly a 10× larger parallel workload. Use Amdahl for fixed-size speedup; Gustafson when the problem grows with resources.<\/p>\n"}, {"id": "l09-performance-008", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q8 — USL and retrograde throughput", "prompt": "Throughput rises to 8 instances then falls at 16/32. Which USL term is implicated and what should change?", "answer": "A decline after a peak is the signature of **coherency/coordination cost β**, not just contention α. More replicas amplify shared-state synchronization, cache invalidation, locks, broadcasts, or cross-node coordination. Reduce shared/coherent state: partition/shard, decentralize coordination, batch, cache, or redesign the bottleneck. Adding instances alone worsens βN(N−1).", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Throughput rises to 8 instances then falls at 16/32. Which USL term is implicated and what should change?<\/p>\n", "answer_html": "<p>A decline after a peak is the signature of <strong>coherency/coordination cost β<\/strong>, not just contention α. More replicas amplify shared-state synchronization, cache invalidation, locks, broadcasts, or cross-node coordination. Reduce shared/coherent state: partition/shard, decentralize coordination, batch, cache, or redesign the bottleneck. Adding instances alone worsens βN(N−1).<\/p>\n"}, {"id": "l09-performance-009", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q9 — Performance anti-patterns", "prompt": "Identify and fix three scenarios: 100 per-user DB calls, giant OrderService, per-request DB connection construction.", "answer": "- 1 + 100 queries → **N+1 query / chatty I/O**; fix with join/batch/prefetch.\n- One service owns unrelated critical work → **god service / serialized bottleneck**; split or isolate queues/resources, use async boundaries.\n- Create/destroy connections per request → **resource churn/no pooling**; use connection pooling/reuse and bounded lifecycle.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Identify and fix three scenarios: 100 per-user DB calls, giant OrderService, per-request DB connection construction.<\/p>\n", "answer_html": "<ul>\n<li>1 + 100 queries → <strong>N+1 query / chatty I/O<\/strong>; fix with join/batch/prefetch.<\/li>\n<li>One service owns unrelated critical work → <strong>god service / serialized bottleneck<\/strong>; split or isolate queues/resources, use async boundaries.<\/li>\n<li>Create/destroy connections per request → <strong>resource churn/no pooling<\/strong>; use connection pooling/reuse and bounded lifecycle.<\/li>\n<\/ul>\n"}, {"id": "l09-performance-010", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q10 — How performance bugs are discovered", "prompt": "Why does profiling find only a small share of performance bugs, and what finds more?", "answer": "Profilers expose where time/resources are spent **under the exercised workload**; they do not tell you that the workload model/API usage/architecture is conceptually wrong. The lecture cites many bugs from misunderstanding workload/API (~67%) and only ~5–10% discovered by profiling, while **code review/inspection** finds a much larger share (~33–57%). Review performance assumptions and API complexity explicitly.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Why does profiling find only a small share of performance bugs, and what finds more?<\/p>\n", "answer_html": "<p>Profilers expose where time/resources are spent <strong>under the exercised workload<\/strong>; they do not tell you that the workload model/API usage/architecture is conceptually wrong. The lecture cites many bugs from misunderstanding workload/API (~67%) and only ~5–10% discovered by profiling, while <strong>code review/inspection<\/strong> finds a much larger share (~33–57%). Review performance assumptions and API complexity explicitly.<\/p>\n"}, {"id": "l09-performance-011", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q11 — Ticket-sale performance test strategy", "prompt": "Design testing for 5k normal users and a 200k-user 60s spike.", "answer": "Sequence a **baseline/smoke → load at 5k → spike to 200k → stress beyond expected peak → scalability/capacity tests → soak/endurance** at sustained realistic traffic. Monitor p50/p95/p99 latency, throughput, errors, saturation (CPU/memory/DB/queues), retries/timeouts, GC, cache hit, dependency SLOs. Realism includes arrival burst shape, transaction mix, think time, hot inventory, auth/payment dependencies.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Design testing for 5k normal users and a 200k-user 60s spike.<\/p>\n", "answer_html": "<p>Sequence a <strong>baseline/smoke → load at 5k → spike to 200k → stress beyond expected peak → scalability/capacity tests → soak/endurance<\/strong> at sustained realistic traffic. Monitor p50/p95/p99 latency, throughput, errors, saturation (CPU/memory/DB/queues), retries/timeouts, GC, cache hit, dependency SLOs. Realism includes arrival burst shape, transaction mix, think time, hot inventory, auth/payment dependencies.<\/p>\n"}, {"id": "l09-performance-012", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q12 — Tail-latency amplification", "prompt": "80 shards; each has 0.5% slow probability. Compute query slow probability and tied-request effect.", "answer": "At least one slow shard: 1−0.995^80 ≈ **33.0%**. If two independent replicas are raced for every subrequest, both slow probability = 0.005² = **0.0025%**; across 80, ≈ **0.20%** chance at least one remains slow. Full tied requests roughly **double subrequest traffic**. True hedging sends a backup only after a tail threshold, so overhead is near the fraction exceeding that threshold, not 100%.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>80 shards; each has 0.5% slow probability. Compute query slow probability and tied-request effect.<\/p>\n", "answer_html": "<p>At least one slow shard: 1−0.995^80 ≈ <strong>33.0%<\/strong>. If two independent replicas are raced for every subrequest, both slow probability = 0.005² = <strong>0.0025%<\/strong>; across 80, ≈ <strong>0.20%<\/strong> chance at least one remains slow. Full tied requests roughly <strong>double subrequest traffic<\/strong>. True hedging sends a backup only after a tail threshold, so overhead is near the fraction exceeding that threshold, not 100%.<\/p>\n"}, {"id": "l09-performance-013", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q13 — Per-service latency budget", "prompt": "End-to-end p99 budget 400ms; current 30+280+50=360. Can recommendation rise to 350ms?", "answer": "Allocate budgets that sum to ≤400 with contingency, e.g. Gateway 40–50, Recommendation ~290–300, DB 50–60 ms. If Recommendation rises 280→350 with others unchanged, end-to-end ≈ **430 ms**, violating the SLO. Approve only if other components improve or the model's value justifies renegotiating the SLO/risk; latency budget is finite like an error budget.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>End-to-end p99 budget 400ms; current 30+280+50=360. Can recommendation rise to 350ms?<\/p>\n", "answer_html": "<p>Allocate budgets that sum to ≤400 with contingency, e.g. Gateway 40–50, Recommendation ~290–300, DB 50–60 ms. If Recommendation rises 280→350 with others unchanged, end-to-end ≈ <strong>430 ms<\/strong>, violating the SLO. Approve only if other components improve or the model's value justifies renegotiating the SLO/risk; latency budget is finite like an error budget.<\/p>\n"}, {"id": "l09-performance-014", "topic": "L09 — Performance Analysis", "section": "L09 — Performance Analysis", "label": "Q14 — Classical PE → cloud-native", "prompt": "Map classical performance-engineering concepts to cloud-native practice and explain “physics hasn't changed.”", "answer": "- Component performance budget → **per-service latency/resource SLO budget**.\n- Budget tracking → **observability, dashboards, SLO/burn monitoring**.\n- Explicit risk acceptance → **error/performance budgets**.\n- Planned PE effort → **continuous performance engineering/capacity work**.\n- Queueing models → **capacity/autoscaling/queue models**.\nCloud changes scale/tooling, not utilization, queues, contention, latency propagation, or finite-resource laws.", "answer_kind": "answer / self-check", "source_path": "L09_Performance.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L09_PerformanceAnalysis.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L09_Performance.md", "prompt_html": "<p>Map classical performance-engineering concepts to cloud-native practice and explain “physics hasn't changed.”<\/p>\n", "answer_html": "<ul>\n<li>Component performance budget → <strong>per-service latency/resource SLO budget<\/strong>.<\/li>\n<li>Budget tracking → <strong>observability, dashboards, SLO/burn monitoring<\/strong>.<\/li>\n<li>Explicit risk acceptance → <strong>error/performance budgets<\/strong>.<\/li>\n<li>Planned PE effort → <strong>continuous performance engineering/capacity work<\/strong>.<\/li>\n<li>Queueing models → <strong>capacity/autoscaling/queue models<\/strong>.\nCloud changes scale/tooling, not utilization, queues, contention, latency propagation, or finite-resource laws.<\/li>\n<\/ul>\n"}, {"id": "l10-security-001", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q1 — Fault–error–failure for SQL injection", "prompt": "Trace SQL injection and a normal apostrophe bug through fault→error→failure. What changes in the security case?", "answer": "Shared **fault:** constructing SQL with untrusted string concatenation instead of parameterization. Normal bug: apostrophe produces malformed query (**error/internal invalid command**) → exception/wrong service (**failure**). Attack: adversarial input changes query semantics (**error: unauthorized query state**) → unauthorized access/data change (**security failure**). Security adds an intelligent adversary exploiting the same defect, so likelihood/blast radius differ.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Trace SQL injection and a normal apostrophe bug through fault→error→failure. What changes in the security case?<\/p>\n", "answer_html": "<p>Shared <strong>fault:<\/strong> constructing SQL with untrusted string concatenation instead of parameterization. Normal bug: apostrophe produces malformed query (<strong>error/internal invalid command<\/strong>) → exception/wrong service (<strong>failure<\/strong>). Attack: adversarial input changes query semantics (<strong>error: unauthorized query state<\/strong>) → unauthorized access/data change (<strong>security failure<\/strong>). Security adds an intelligent adversary exploiting the same defect, so likelihood/blast radius differ.<\/p>\n"}, {"id": "l10-security-002", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q2 — SAST vs threat modeling first", "prompt": "Use McGraw's 50/50 idea and Avizienis's four means to reason about a startup's first investment.", "answer": "Only one leaves a major blind spot: automated code tools mainly find **implementation bugs**, threat modeling finds **design flaws**. A defensible startup-first choice is lightweight threat modeling for auth/data/trust boundaries because design flaws are expensive to retrofit, then automate SAST immediately after; alternatively SAST can be first when code churn and zero automation dominate. Map means: prevention→secure design/training; tolerance→sandboxing/least privilege/fail-safe recovery; removal→SAST/testing/patching; forecasting→risk/threat/vulnerability analysis.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Use McGraw's 50/50 idea and Avizienis's four means to reason about a startup's first investment.<\/p>\n", "answer_html": "<p>Only one leaves a major blind spot: automated code tools mainly find <strong>implementation bugs<\/strong>, threat modeling finds <strong>design flaws<\/strong>. A defensible startup-first choice is lightweight threat modeling for auth/data/trust boundaries because design flaws are expensive to retrofit, then automate SAST immediately after; alternatively SAST can be first when code churn and zero automation dominate. Map means: prevention→secure design/training; tolerance→sandboxing/least privilege/fail-safe recovery; removal→SAST/testing/patching; forecasting→risk/threat/vulnerability analysis.<\/p>\n"}, {"id": "l10-security-003", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q3 — Pick one security tool under CI constraints", "prompt": "Compare SAST, DAST, and SCA for 5 deployments/day and 30% tool effectiveness.", "answer": "- **SAST:** early/custom-code reach but high false-positive triage; usually fits build/PR.\n- **DAST:** realistic runtime findings/low FP but ~14 min cited overhead → ~70 min/day if serial across five deploys; run asynchronously/nightly or on staging.\n- **SCA:** low friction and excellent known-dependency CVEs, but no custom-code/design coverage.\n~30% effectiveness means no tool is a complete security program. Pick based on dominant exposure and complement it with review/threat modeling.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>Compare SAST, DAST, and SCA for 5 deployments/day and 30% tool effectiveness.<\/p>\n", "answer_html": "<ul>\n<li><strong>SAST:<\/strong> early/custom-code reach but high false-positive triage; usually fits build/PR.<\/li>\n<li><strong>DAST:<\/strong> realistic runtime findings/low FP but ~14 min cited overhead → ~70 min/day if serial across five deploys; run asynchronously/nightly or on staging.<\/li>\n<li><strong>SCA:<\/strong> low friction and excellent known-dependency CVEs, but no custom-code/design coverage.\n~30% effectiveness means no tool is a complete security program. Pick based on dominant exposure and complement it with review/threat modeling.<\/li>\n<\/ul>\n"}, {"id": "l10-security-004", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q4 — Code review + fuzzing", "prompt": "What does each technique catch, and how should a bank combine them?", "answer": "Security-focused review is strong for **business logic, authorization, trust-boundary, crypto/API misuse** but can miss huge input spaces. Fuzzing is strong for **parser/input handling, memory safety, crashes/DoS** but may miss semantic fraud that does not crash. Use security checklists/assigned reviewers and threat-model references; fuzz critical transfer parsers/APIs with coverage guidance/sanitizers and realistic seeds. For fraud, logic review/threat modeling is central; for DoS/input corruption, fuzzing is central.", "answer_kind": "answer / self-check", "source_path": "L10_Security.md", "source_url": "https://sqrbok.github.io//content/material/sqr/RQ_L10_Security.html", "github_url": "https://github.com/LocalT0aster/Notes/blob/master/Course/SQRS/L10_Security.md", "prompt_html": "<p>What does each technique catch, and how should a bank combine them?<\/p>\n", "answer_html": "<p>Security-focused review is strong for <strong>business logic, authorization, trust-boundary, crypto/API misuse<\/strong> but can miss huge input spaces. Fuzzing is strong for <strong>parser/input handling, memory safety, crashes/DoS<\/strong> but may miss semantic fraud that does not crash. Use security checklists/assigned reviewers and threat-model references; fuzz critical transfer parsers/APIs with coverage guidance/sanitizers and realistic seeds. For fraud, logic review/threat modeling is central; for DoS/input corruption, fuzzing is central.<\/p>\n"}, {"id": "l10-security-005", "topic": "L10 — Security", "section": "L10 — Security", "label": "Q5 — Apply STRIDE", "prompt": "Give one web-banking threat per STRIDE category with a target and mitigation.", "answer": "Example set:\n- **S**poofing: stolen session impersonates user → MFA/session binding.\n- **T**ampering: modify request/account data → integrity checks + authorization.\n- **R**epudiation: admin denies transfer → tamper-evident audit log.\n- **I**nformation disclosure: session/account data leak → encryption + access control.\n- **D**oS: flood Auth Service → rate limits/circuit breakers/capacity controls.\n- **E**levation: normal user reaches Admin Panel → deny-by-default RBAC.\nSTRIDE recall is incomplete; add insider, side-channel, and supply-chain analysis.", "answer_kind": "answer / self-check", "source_
